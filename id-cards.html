<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simtec — Consultant ID Cards</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
<script src="auth.js?v=3" data-roles="admin,manager"></script>
<style>
  :root{--navy:#122347;--gold:#c6a15b;--ink:#1a2334;--sub:#5a6779;--line:#e2e7ee;--bg:#eef1f5;--red:#c1272d}
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0}
  header{background:linear-gradient(135deg,#111f3d,#1a2c53);color:#fff;padding:15px 18px}
  .hwrap{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .htitle{font-size:19px;font-weight:800}
  .htitle small{display:block;font-weight:500;font-size:12px;color:#c9d3e6;margin-top:2px}
  header a.back{color:#cbd5e1;text-decoration:none;font-size:13px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  input[type=search]{font:inherit;border:1px solid #cbd4df;border-radius:9px;padding:9px 12px;min-width:220px}
  .btn{border:none;border-radius:9px;padding:10px 15px;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#d9be86);color:var(--navy)}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-ghost{background:#fff;border:1px solid #cbd4df;color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .count{color:var(--sub);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 2px rgba(17,31,61,.04)}
  .tile .sel{align-self:flex-start;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .tile .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;width:100%}
  .tile .acts .btn{padding:8px 12px;font-size:12.5px;flex:1;min-width:104px;text-align:center}
  .miniwrap{transform:scale(.92);transform-origin:top center}
  #loading{color:var(--sub);padding:30px 6px}
  .msg{max-width:1100px;margin:0 auto;padding:0 14px}
  .err{background:#fdecec;border:1px solid #e0b4b0;color:#b4342e;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;margin-top:14px}

  /* ============ THE CARD — 50mm x 78mm, fits a laminating pouch ============ */
  .idcard{width:50mm;height:78mm;box-sizing:border-box;padding:3mm 3mm 2.5mm;background:#fff;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    font-family:Arial,Helvetica,sans-serif;color:#20242c;overflow:hidden;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .idlogo{height:12mm;width:auto;margin:.6mm 0 1.4mm;display:block}
  .idphoto{width:33mm;height:40mm;object-fit:cover;border:.9mm solid #0F2C57;border-radius:1mm;background:#e9edf2}
  .idphoto.noph{display:flex;align-items:center;justify-content:center;color:#9aa6b4;font-size:8pt;border-style:dashed;border-color:#c7ccd4}
  .idname{font-weight:bold;font-size:11pt;margin-top:2mm;line-height:1.1}
  .ididnum{font-size:8.5pt;color:#333;margin-top:.7mm}
  .idorg{font-style:italic;font-size:7pt;color:#3a3f47;margin-top:1.6mm}
  .idcontact{font-style:italic;font-size:6.5pt;color:#3a3f47;margin-top:.4mm}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="htitle">Consultant ID Cards<small>Upload a photo, then print one card or a batch. Cards are sized for a laminating pouch (50 × 78 mm).</small></div>
    <a class="back" href="consultants.html">‹ Consultants &amp; Teams</a>
  </div>
</header>

<div class="msg"><div id="err" class="err" style="display:none"></div></div>

<div class="wrap">
  <div class="bar">
    <input type="search" id="q" placeholder="Search consultants…" oninput="render()">
    <button class="btn btn-ghost" onclick="toggleAll()">Select all</button>
    <button class="btn btn-gold" id="batchBtn" onclick="printBatch()">🖨 Print selected</button>
    <span class="count" id="count"></span>
  </div>
  <div id="loading">Loading consultants…</div>
  <div id="grid" class="grid"></div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

const SB_URL = "https://jvqjoenaungubpoegyvf.supabase.co";
const SB_KEY = "sb_publishable_J4MYTdJJyEaWe-GadpwdYA_upPT2rKw";
let sb = null, U = {};
let CONS = [];                 // all consultants
const SEL = new Set();         // ids selected for batch
let uploadTarget = null;       // consultant id the file picker is acting on

const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fail(m){ $("loading").style.display="none"; const e=$("err"); e.style.display="block"; e.innerHTML="<b>Couldn't load the ID card page.</b><br><br>"+esc(m); }

// look-official ID number, e.g. 03-4926. Irrelevant value, just for the look;
// generated once and stored so a reprinted card always matches.
function genId(){ return String(Math.floor(10+Math.random()*90))+"-"+String(Math.floor(1000+Math.random()*9000)); }

async function waitForAuth(ms){ const t=Date.now(); while(Date.now()-t<ms){ if(window.SIMTEC_USER&&window.SIMTEC_USER.id) return true; await new Promise(r=>setTimeout(r,50)); } return false; }

(async function init(){
  await waitForAuth(8000);
  U = window.SIMTEC_USER || {};
  sb = (window.SIMTEC_SB) || supabase.createClient(SB_URL, SB_KEY);
  try{
    const { data, error } = await sb.from("commission_consultants")
      .select("id,name,active,photo,id_card_no").order("name");
    if(error) throw new Error(error.message);
    CONS = (data||[]).filter(c=>c.active!==false);
    // assign any missing ID numbers once, and persist
    for(const c of CONS){
      if(!c.id_card_no){
        c.id_card_no = genId();
        const { error:e2 } = await sb.from("commission_consultants").update({id_card_no:c.id_card_no}).eq("id",c.id);
        if(e2){ /* non-fatal: still show the number this session */ }
      }
    }
    $("loading").style.display="none";
    render();
  }catch(e){ fail(e.message||String(e)); }
})();

// ---- the card markup (shared by preview + print) ----
function cardHTML(c){
  const photo = c.photo
    ? `<img class="idphoto" src="${c.photo}" alt="">`
    : `<div class="idphoto noph">No photo</div>`;
  return `<div class="idcard">
    <img class="idlogo" src="${LOGO}" alt="Simtec Therapeutic">
    ${photo}
    <div class="idname">${esc(c.name||"")}</div>
    <div class="ididnum">ID #: ${esc(c.id_card_no||"")}</div>
    <div class="idorg">Representing Simtec Therapeutic Limited</div>
    <div class="idcontact">info@simtectp.com | 09 886 9897</div>
  </div>`;
}

function render(){
  const q = ($("q").value||"").trim().toLowerCase();
  const list = CONS.filter(c=>!q || (c.name||"").toLowerCase().includes(q));
  $("grid").innerHTML = list.map(c=>`
    <div class="tile">
      <label class="sel"><input type="checkbox" ${SEL.has(c.id)?"checked":""} onchange="toggleOne('${c.id}',this.checked)"> Include in batch</label>
      <div class="miniwrap">${cardHTML(c)}</div>
      <div class="acts">
        <button class="btn btn-ghost" onclick="pickPhoto('${c.id}')">${c.photo?"Replace photo":"Upload photo"}</button>
        <button class="btn btn-navy" onclick="printOne('${c.id}')">🖨 Print card</button>
      </div>
    </div>`).join("") || `<div class="count">No consultants match.</div>`;
  $("count").textContent = `${SEL.size} selected · ${CONS.length} consultant${CONS.length===1?"":"s"}`;
  $("batchBtn").textContent = SEL.size ? `🖨 Print selected (${SEL.size})` : "🖨 Print all";
}

function toggleOne(id,on){ on?SEL.add(id):SEL.delete(id); $("count").textContent=`${SEL.size} selected · ${CONS.length} consultants`; $("batchBtn").textContent=SEL.size?`🖨 Print selected (${SEL.size})`:"🖨 Print all"; }
function toggleAll(){ const q=($("q").value||"").trim().toLowerCase(); const list=CONS.filter(c=>!q||(c.name||"").toLowerCase().includes(q)); const allOn=list.every(c=>SEL.has(c.id)); list.forEach(c=>allOn?SEL.delete(c.id):SEL.add(c.id)); render(); }

// ---- photo upload: downscale + cover-crop to the card's photo aspect, store as
// a compressed JPEG data URL on the consultant record (no storage bucket needed) ----
function pickPhoto(id){ uploadTarget=id; const fi=$("fileInput"); fi.value=""; fi.click(); }
$("fileInput").addEventListener("change", function(){
  const f=this.files&&this.files[0]; if(!f||!uploadTarget) return;
  const id=uploadTarget;
  const rd=new FileReader();
  rd.onload=e=>{
    const img=new Image();
    img.onload=async ()=>{
      const tw=462, th=560;                         // 33:40 card-photo aspect
      const cv=document.createElement("canvas"); cv.width=tw; cv.height=th;
      const ctx=cv.getContext("2d");
      const ar=img.width/img.height, tar=tw/th; let sw,sh,sx,sy;
      if(ar>tar){ sh=img.height; sw=sh*tar; sx=(img.width-sw)/2; sy=0; }
      else { sw=img.width; sh=sw/tar; sx=0; sy=(img.height-sh)/2; }
      ctx.drawImage(img,sx,sy,sw,sh,0,0,tw,th);
      const dataUrl=cv.toDataURL("image/jpeg",0.82);
      const { error }=await sb.from("commission_consultants").update({photo:dataUrl}).eq("id",id);
      if(error){ alert("Couldn't save the photo: "+error.message); return; }
      const c=CONS.find(x=>x.id===id); if(c) c.photo=dataUrl;
      render();
    };
    img.onerror=()=>alert("That file didn't look like an image.");
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
});

  .idname{font-weight:bold;font-size:11pt;margin-top:2mm;line-height:1.1}
  .ididnum{font-size:8.5pt;color:#333;margin-top:.7mm}
  .idorg{font-style:italic;font-size:7pt;color:#3a3f47;margin-top:1.6mm}
  .idcontact{font-style:italic;font-size:6.5pt;color:#3a3f47;margin-top:.4mm}
`;

// ---- cut guides: a solid trim line + corner crop marks around each card ----
// The solid rectangle is the "cut along this with scissors" line; the corner
// ticks extend into the gutter so a ruler + blade can make straight cuts across
// a whole sheet, and neighbouring cards' ticks line up column-to-column.
const CUT_CSS = `
  .cut{position:relative;width:50mm;height:78mm;break-inside:avoid;page-break-inside:avoid}
  .cut .idcard{border:0.4mm solid #000}
  .cm{position:absolute}
  .cm.v{width:0;height:4mm;border-left:0.4mm solid #000}
  .cm.h{width:4mm;height:0;border-top:0.4mm solid #000}
  .tl.v{left:0;top:0;transform:translate(-50%,-100%)}
  .tl.h{left:0;top:0;transform:translate(-100%,-50%)}
  .tr.v{right:0;top:0;transform:translate(50%,-100%)}
  .tr.h{right:0;top:0;transform:translate(100%,-50%)}
  .bl.v{left:0;bottom:0;transform:translate(-50%,100%)}
  .bl.h{left:0;bottom:0;transform:translate(-100%,50%)}
  .br.v{right:0;bottom:0;transform:translate(50%,100%)}
  .br.h{right:0;bottom:0;transform:translate(100%,50%)}
`;
const MARKS = `<span class="cm tl v"></span><span class="cm tl h"></span>`+
  `<span class="cm tr v"></span><span class="cm tr h"></span>`+
  `<span class="cm bl v"></span><span class="cm bl h"></span>`+
  `<span class="cm br v"></span><span class="cm br h"></span>`;
function cutWrap(c){ return `<div class="cut">${MARKS}${cardHTML(c)}</div>`; }

function printOne(id){
  const c=CONS.find(x=>x.id===id); if(!c) return;
  const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print the card."); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>ID card — ${esc(c.name||"")}</title>
  <style>@page{size:A4;margin:12mm}html,body{margin:0;padding:0}
    .sheet{display:flex;justify-content:center;padding-top:6mm}
    ${PRINT_CSS}${CUT_CSS}</style></head>
  <body><div class="sheet">${cutWrap(c)}</div><script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

function printBatch(){
  let list = SEL.size ? CONS.filter(c=>SEL.has(c.id)) : CONS.slice();
  if(!list.length){ alert("No consultants to print."); return; }
  const w=window.open("","_blank"); if(!w){ alert("Allow pop-ups to print the cards."); return; }
  const cards = list.map(c=>cutWrap(c)).join("");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>ID cards — batch (${list.length})</title>
  <style>@page{size:A4;margin:10mm}html,body{margin:0;padding:0}
    .sheet{display:grid;grid-template-columns:repeat(3,50mm);column-gap:8mm;row-gap:10mm;justify-content:center;align-content:start}
    ${PRINT_CSS}${CUT_CSS}</style></head>
  <body><div class="sheet">${cards}</div>
  <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}
</script>
</body>
</html>
