<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simtec — Rewards Settings</title>
<style>
  :root{ --navy:#0e2038; --gold:#c9a84c; --ink:#0e1726; --paper:#f4f6f9; --line:#dfe5ec; --ok:#0f7b3f; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink)}
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 80px}
  h1{font-size:22px;margin:6px 0 2px}
  p.lead{color:#51617a;margin:0 0 18px;line-height:1.5}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 18px;box-shadow:0 8px 30px rgba(14,32,56,.05)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .lab b{display:block;font-size:14.5px;color:var(--ink)}
  .row .lab span{display:block;font-size:12px;color:#7a889c;margin-top:2px;line-height:1.4}
  input[type=number]{width:120px;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;text-align:right;outline:none}
  input[type=number]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
  .save{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:flex-end}
  .save .msg{margin-right:auto;font-size:13.5px;color:#7a889c}
  .save .msg.ok{color:var(--ok);font-weight:600}
  .save .msg.err{color:#b3261e;font-weight:600}
  button.btn{padding:13px 22px;border:0;border-radius:11px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  button.btn:disabled{opacity:.5}
  .center{text-align:center;padding:50px 0;color:#7a889c}
</style>
</head>
<body>
<div class="wrap">
  <h1>Rewards settings</h1>
  <p class="lead">Admin only. Set the points and spins the rewards app awards — changes take effect immediately, no code needed.</p>
  <div id="view" class="card"><div class="center">Loading…</div></div>
</div>
<div class="save" id="saveBar" style="display:none">
  <span class="msg" id="msg"></span>
  <button class="btn" id="saveBtn">Save changes</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
<script src="auth.js?v=3" data-roles="admin"></script>
<script>
const SUPA_URL="https://jvqjoenaungubpoegyvf.supabase.co";
const SUPA_KEY="sb_publishable_J4MYTdJJyEaWe-GadpwdYA_upPT2rKw";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, { auth:{ persistSession:true } });
const $=id=>document.getElementById(id);

// friendly label + help for each config key (only these are shown/editable)
const FIELDS = [
  ["payPts","Points per weekly payment","Awarded automatically each time a direct-debit payment clears."],
  ["extraPts","Points per extra / card payment","For an extra or Stripe card payment."],
  ["spinsPerPay","Free spins per payment","How many spins a payment earns."],
  ["refPts","Points for a referral that buys","Awarded when a referred person becomes a customer."],
  ["cardEvery","Points per $50 reward card","How many points convert into one $50 card."],
  ["cardValue","Reward card value ($)","Dollar value of one reward card."],
  ["drawPts","Monthly draw prize (points)","The monthly review-draw prize."],
  ["surpriseOnTime","Surprise drop — pay on time","Occasional bonus for an on-time payment."],
  ["surpriseExtra","Surprise drop — extra payment","Occasional bonus for an extra payment."],
  ["surpriseRefer","Surprise drop — refer a buyer","Occasional bonus for a referral that buys."],
];

async function load(){
  const { data, error } = await sb.from("loyalty_config").select("key,value");
  if(error){ $("view").innerHTML='<div class="center">Couldn\'t load settings.<br>'+error.message+'</div>'; return; }
  const map={}; (data||[]).forEach(r=>map[r.key]=r.value);
  const rows = FIELDS.map(([k,lab,help])=>`
    <div class="row">
      <div class="lab"><b>${lab}</b><span>${help}</span></div>
      <input type="number" id="cfg_${k}" value="${map[k]??""}" step="1" min="0">
    </div>`).join("");
  $("view").innerHTML = rows;
  $("saveBar").style.display="flex";
}

$("saveBtn").onclick=async()=>{
  $("saveBtn").disabled=true; $("msg").className="msg"; $("msg").textContent="Saving…";
  try{
    const updates = FIELDS.map(([k])=>{
      const el=$("cfg_"+k); const v=el?Number(el.value):null;
      return (v!=null && !Number.isNaN(v)) ? { key:k, value:v } : null;
    }).filter(Boolean);
    // upsert each value (office-only via RLS)
    for(const u of updates){
      const { error } = await sb.from("loyalty_config").update({ value:u.value, updated_at:new Date().toISOString() }).eq("key",u.key);
      if(error) throw error;
    }
    $("msg").className="msg ok"; $("msg").textContent="✓ Saved — live now.";
  }catch(e){
    $("msg").className="msg err"; $("msg").textContent="Couldn't save: "+(e.message||e);
  }
  $("saveBtn").disabled=false;
};

load();
</script>
</body>
</html>
