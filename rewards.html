function runConfetti(cv){
  const ctx=cv.getContext("2d"), W=cv.width, H=cv.height, cols=["#c9a84c","#f0d98a","#ffffff","#cfd3da","#8fb4e8"], P=[];
  for(let i=0;i<130;i++) P.push({x:W/2,y:H*0.42,vx:(Math.random()-0.5)*15,vy:(Math.random()-0.95)*15,g:0.32,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-0.5)*0.4,life:1});
  let t=0;(function anim(){ t++; ctx.clearRect(0,0,W,H); let alive=false;
    P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.008;
      if(p.life>0&&p.y<H+30){ alive=true; ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); ctx.restore(); } });
    if(alive&&t<240) requestAnimationFrame(anim); })();
}

  }catch(e){}
}
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.href="customer-login.html"; return; }
  await loadAll(); render(); checkCelebrations();
}
async function loadAll(){
  const [r,s,c,d,u,pl,ms,lb,rf]=await Promise.all([
    sb.rpc("my_rewards"), sb.rpc("my_status"), sb.rpc("my_cards"), sb.rpc("draw_status"), sb.rpc("unread_count"), sb.rpc("my_plan"), sb.rpc("my_milestones"), sb.rpc("leaderboard"), sb.rpc("my_referrals")
  ]);
  R=r.data||{}; S=s.data||{}; CARDS=c.data||[]; DRAW=d.data||{}; UNREAD=u.data||0; PLAN=pl.data||{}; MS=ms.data||[]; LB=lb.data||{}; REFS=rf.data||[];
}

function ratingLabel(){ return (S.rating||"A"); }
function render(){
  tabsEl.style.display="flex";
  tabsEl.innerHTML=[["home","Home","🏠"],["play","Play","🎰"],["rewards","Rewards","🎁"],["loot","Loot","🎯"],["draw","Draw","🎟️"]]
    .map(([k,l,i])=>`<button class="tab ${TAB===k?'on':''}" onclick="setTab('${k}')"><span class="ic">${i}</span>${l}</button>`).join("");

  const hero=`
    <div class="top">
      <h1>My Simtec Rewards</h1>
      <button class="bell" onclick="openInbox()">🔔${UNREAD>0?`<b>${UNREAD>9?'9+':UNREAD}</b>`:''}</button>
    </div>
    <div class="hero">
      <div class="pts">${nf(R.points)} <span>points</span></div>
      <div class="chips">
        <div class="chip"><span class="k">Level</span>${nf(R.level)}</div>
        <div class="chip rating"><span class="k" style="color:#6a5410">Rating</span>${ratingLabel()}</div>
        <div class="chip"><span class="k">Spins</span>${nf(R.spins)}</div>
      </div>
    </div>`;

  let body="";
  if(TAB==="home") body=homeView();
  else if(TAB==="play") body=playView();
  else if(TAB==="rewards") body=rewardsView();
  else if(TAB==="loot") body=lootView();
  else if(TAB==="draw") body=drawView();

  app.innerHTML=hero+body;
}

function homeView(){
  const sb_=(S.streak_badges||[]), rb=(S.referrer_badges||[]);
  const badges=[...sb_.map(n=>`<span class="badge">🔥 ${n} on-time</span>`), ...rb.map(n=>`<span class="badge">🤝 ${n===25?'Super Referrer':n+' referred'}</span>`)];
  return missedBanner()+raceView()+`
    <h2>Your standing</h2>
    <div class="card">
      <div class="muted">Payment streak: <b style="color:var(--ink)">${nf(S.current_streak)}</b> in a row · best ever <b style="color:var(--ink)">${nf(S.max_streak)}</b><br>
      Rating <b style="color:var(--gold)">${ratingLabel()}</b> — keep paying on time to reach AAA.</div>
      ${badges.length?`<div style="margin-top:12px">${badges.join("")}</div>`:`<div class="muted" style="margin-top:10px">Earn badges by paying on time and referring friends.</div>`}
    </div>
    ${leaderboardView()}
    ${sleepTipView()}
    <h2>Sound</h2>
    <div class="card"><button class="btn ghost sm" onclick="toggleSound(this)">${SFX.enabled?'🔊 Sound on — tap to mute':'🔇 Sound off — tap on'}</button></div>
    <div class="card"><button class="btn ghost sm" onclick="signOut()">Sign out</button></div>`;
}

function missedBanner(){
  if(!PLAN||!PLAN.missed) return "";
  const tel=SIMTEC_PHONE.replace(/[^\d+]/g,"");
  return `<div class="card" style="background:rgba(255,214,90,.10);border:1px solid rgba(255,214,90,.42)">
    <div style="font-weight:800;font-size:16px">💛 A payment didn\'t go through</div>
    <div class="muted" style="margin:6px 0 12px;color:#e7ddc0">No stress — it happens. Quick heads-up: Ezidebit charges an $11.50 fee on a missed payment (that\'s their charge, not ours), and a miss can dent your streak and rating. Let\'s sort it out together — no judgment.</div>
    <div class="row">
      <button class="btn sm" onclick="location.href='tel:${tel}'">📞 Call us</button>
      <button class="btn sm ghost" onclick="location.href='mailto:'+SIMTEC_EMAIL">✉️ Email us</button>
    </div>
  </div>`;
}
function raceView(){
  if(!PLAN||!PLAN.has_order) return "";
  const delivered=PLAN.delivered, crossed=!delivered && (PLAN.authorised || PLAN.pct_to_delivery>=100);
  let title,pct,hint;
  if(delivered){ title="🏁 Race to paying it off"; pct=PLAN.pct_paid; hint=`$${nf(PLAN.owing)} to go`; }
  else if(crossed){ title="🎉 Cleared for delivery!"; pct=100; hint="We'll be in touch to arrange your delivery"; }
  else { title="🚚 Race to delivery"; pct=PLAN.pct_to_delivery; hint=`${pct}% of the way there`; }
  const track=`<div style="position:relative;height:44px;margin:12px 0 4px">
      <div style="position:absolute;top:22px;left:0;right:0;height:6px;background:rgba(255,255,255,.1);border-radius:3px"></div>
      <div style="position:absolute;top:22px;left:0;height:6px;width:${pct}%;background:linear-gradient(90deg,var(--good),var(--gold));border-radius:3px;transition:width .7s"></div>
      <div style="position:absolute;top:2px;left:calc(${pct}% - 13px);font-size:24px;transition:left .7s">🚚</div>
      <div style="position:absolute;top:14px;right:-2px;font-size:20px">🏁</div>
    </div><div class="muted" style="text-align:center">${hint}</div>`;
  let extra="";
  if(delivered){ extra=`<button class="btn gold sm" style="margin-top:14px" onclick="payExtra('extra')">💳 Make an extra payment</button>`; }
  else if(!crossed && PLAN.deposit_shortfall>0){ extra=`<div style="margin-top:14px;padding:14px;border-radius:12px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.4)">
      <div style="font-weight:800">⚡ Fast Track your delivery</div>
      <div class="muted" style="margin:4px 0 10px">Pay $${nf(PLAN.deposit_shortfall)} now to reach your deposit and get delivered sooner.</div>
      <button class="btn gold sm" onclick="payExtra('deposit')">Fast Track — $${nf(PLAN.deposit_shortfall)}</button></div>`; }
  return `<div class="card"><div style="font-weight:800;font-size:17px">${title}</div>${track}${extra}</div>`;
}
async function payExtra(purpose){
  if(busy) return; busy=true;
  try{ const { data }=await sb.functions.invoke("stripe-create-session",{ body:{ purpose } });
    if(data&&data.url){ location.href=data.url; return; }
    toast("Card payments are coming soon");
  }catch(e){ toast("Card payments are coming soon"); }
  busy=false;
}
function leaderboardView(){
  if(!LB) return "";
  if(!LB.opted_in){
    return `<h2>Leaderboard</h2><div class="card">
      <div class="muted" style="margin-bottom:12px">See how you rank all-time. Opt in and only your first name shows to others.</div>
      <button class="btn ghost sm" onclick="toggleBoard(true)">Join the leaderboard</button></div>`;
  }
  const top=(LB.top||[]).slice(0,5);
  const rows=top.map(r=>`<div class="cardrow"><span>${r.rank}. ${r.me?'<b style="color:var(--gold)">You</b>':(esc(r.name)||"—")}</span><b>${nf(r.points)}</b></div>`).join("");
  const inTop=top.some(r=>r.me);
  const mine=(!inTop && LB.my_rank)?`<div class="cardrow" style="border-top:1px solid var(--line)"><span><b style="color:var(--gold)">You — #${LB.my_rank}</b></span><b>${nf(LB.my_points)}</b></div>`:"";
  return `<h2>Leaderboard</h2><div class="card">${rows||'<div class="muted">No one on the board yet — you could be first!</div>'}${mine}
    <button class="btn ghost sm" style="margin-top:12px" onclick="toggleBoard(false)">Leave the leaderboard</button></div>`;
}
async function toggleBoard(on){ if(busy) return; busy=true; try{ await sb.rpc("set_leaderboard_optin",{ p_on:on }); await loadAll(); }catch(e){} busy=false; render(); }
function sleepTipView(){
  return `<h2>Tonight's sleep tip</h2><div class="card">
    <div style="font-size:15px;line-height:1.55">🌙 ${esc(SLEEP_TIPS[TIP_I])}</div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="TIP_I=(TIP_I+1)%SLEEP_TIPS.length; render();">Another tip</button>
    <div class="muted" style="font-size:11px;margin-top:8px">A fresh tip every morning · ${SLEEP_TIPS.length} in rotation</div>
  </div>`;
}
function referralView(){
  const rows=(REFS||[]).map(r=>`<div class="cardrow"><span>${esc(r.name)}${r.suburb?`, ${esc(r.suburb)}`:""}</span><b>${esc(r.status)}</b></div>`).join("");
  return `<h2>Refer a mate — earn 50,000 points</h2><div class="card">
    <div class="muted" style="margin-bottom:12px">Know someone who'd love better sleep? Pop their details in and our team will look after them. You get <b style="color:var(--gold)">+50,000 points</b> once they buy and get going.</div>
    <input id="refName" class="inp" placeholder="Their name" autocomplete="off">
    <input id="refMobile" class="inp" type="tel" placeholder="Their mobile" autocomplete="off">
    <input id="refSuburb" class="inp" placeholder="Their suburb" autocomplete="off">
    <div id="refMsg" class="muted" style="margin:4px 0"></div>
    <button class="btn gold sm" onclick="doReferral()">Send referral</button>
    ${rows?`<div style="margin-top:14px"><div class="muted" style="font-size:12px;margin-bottom:6px">Your referrals</div>${rows}</div>`:""}
  </div>`;
}
async function doReferral(){
  if(busy) return;
  const n=document.getElementById("refName"), m=document.getElementById("refMobile"), su=document.getElementById("refSuburb"), msg=document.getElementById("refMsg");
  busy=true; if(msg) msg.textContent="Sending…";
  try{
    const { data } = await sb.rpc("submit_referral",{ p_name:(n&&n.value)||"", p_mobile:(m&&m.value)||"", p_suburb:(su&&su.value)||"" });
    const res=data||{};
    if(res.ok){ try{SFX.win();}catch(e){} await loadAll(); busy=false; renderKeepTab("loot");
      const mm=document.getElementById("refMsg"); if(mm){ mm.textContent="Sent! Our team will take it from here. 🙌"; mm.style.color="var(--gold)"; }
      return; }
    if(msg){ msg.textContent=res.error||"Hmm, that didn't work — try again."; msg.style.color="#f2b8b8"; }
  }catch(e){ if(msg){ msg.textContent="Hmm, that didn't work — try again."; msg.style.color="#f2b8b8"; } }
  busy=false;
}
function playView(){
  return `
    <h2>Spin to win</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:12px">You have <b style="color:var(--ink)">${nf(R.spins)}</b> spin${R.spins==1?'':'s'}. Every payment earns one.</div>
      <button class="btn gold" id="spinBtn" onclick="doSpin()" ${R.spins>0?'':'disabled'}>${R.spins>0?'🎰 Spin':'No spins yet'}</button>
      <div id="spinOut"></div>
    </div>
    <h2>Daily bonus</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:12px">A free bonus, once a day.</div>
      <button class="btn" id="dailyBtn" onclick="doDaily()" ${R.daily_available?'':'disabled'}>${R.daily_available?'🎁 Claim daily bonus':'✓ Claimed today'}</button>
      <div id="dailyOut"></div>
    </div>`;
}

function rewardsView(){
  const avail=CARDS.filter(c=>c.status==="available"), used=CARDS.filter(c=>c.status!=="available");
  let h=`<h2>Your $50 reward cards</h2>`;
  if(!CARDS.length) h+=`<div class="card"><div class="muted">You haven't earned a reward card yet — you get a $50 card every 50,000 points. Keep going!</div></div>`;
  avail.forEach(c=>{ h+=`<div class="card">
      <div style="font-weight:800;font-size:17px;margin-bottom:2px">🎁 $${nf(c.value)} reward card</div>
      <div class="muted" style="margin-bottom:12px">Choose how to use it:</div>
      <div class="row" style="margin-bottom:8px">
        <button class="btn sm" onclick="redeem('${c.id}','giftcard')">Gift card</button>
        <button class="btn sm gold" onclick="redeem('${c.id}','plan_credit')">$50 off my plan</button>
      </div>
      <button class="btn sm ghost" onclick="redeem('${c.id}','donation')">Donate to my group</button>
    </div>`; });
  if(used.length){ h+=`<h2>Used</h2><div class="card">${used.map(c=>`<div class="cardrow"><span>$${nf(c.value)} card</span><span class="muted">${c.redeemed_as? c.redeemed_as.replace('_',' '):'redeemed'}</span></div>`).join("")}</div>`; }
  return h;
}

function lootView(){
  const pct=(PLAN&&PLAN.has_order)?PLAN.pct_paid:0, has=k=>MS.indexOf(k)>=0;
  const miles=[{k:"pct25",at:25,t:"25% paid off",r:"10,000 bonus points"},
               {k:"pct50",at:50,t:"Halfway there — 50% paid",r:"A free pillow"},
               {k:"paidfull",at:100,t:"Paid in full",r:"Lifetime Triple-A + 10% off your next order"}];
  let h=`<h2>Milestones</h2>`;
  miles.forEach(m=>{ const done=has(m.k)||pct>=m.at, prog=Math.min(100,Math.round(pct/m.at*100));
    h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800">${done?"✅ ":"🔒 "}${m.t}</div>
        <div class="muted" style="font-size:12px">${done?"Unlocked":pct+"% / "+m.at+"%"}</div></div>
      <div class="muted" style="margin:4px 0 ${done?"0":"10px"}">${m.r}</div>
      ${done?"":`<div style="height:6px;background:rgba(255,255,255,.1);border-radius:3px"><div style="height:6px;width:${prog}%;background:linear-gradient(90deg,var(--good),var(--gold));border-radius:3px"></div></div>`}
    </div>`; });
  h+=`<h2>Ways to earn</h2><div class="card">
    <div class="cardrow"><span>Make your weekly payment</span><b style="color:var(--gold)">+200 &amp; a spin</b></div>
    <div class="cardrow"><span>Make an extra payment</span><b style="color:var(--gold)">+1,000</b></div>
    <div class="cardrow"><span>Refer a mate who buys</span><b style="color:var(--gold)">+50,000</b></div>
  </div>
  ${referralView()}`;
  return h;
}
function drawView(){
  const L=DRAW.latest;
  let h=`<h2>Monthly draw</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:12px">Leave us a review to enter this month's free draw for points. One entry per month.</div>
      <button class="btn" id="drawBtn" onclick="doDraw()" ${DRAW.entered_this_month?'disabled':''}>${DRAW.entered_this_month?'✓ Entered this month':'📝 Review & enter'}</button>
    </div>`;
  if(L){ h+=`<h2>Latest winner</h2><div class="card ${L.i_won?'':''}">
      <div style="font-weight:800;font-size:17px">${L.i_won?'🎉 You won!':'🏆 '+(L.winner_first||'A member')+' won'}</div>
      <div class="muted" style="margin-top:4px">${nf(L.prize)} points${L.i_won?' — added to your balance':''}.</div>
    </div>`; }
  return h;
}

// ---- actions ----
function setTab(t){ TAB=t; render(); }
function toggleSound(btn){ SFX.enabled=!SFX.enabled; btn.textContent=SFX.enabled?'🔊 Sound on — tap to mute':'🔇 Sound off — tap on'; }

async function doSpin(){
  if(busy||!(R.spins>0)) return; busy=true;
  const btn=$("spinBtn"); if(btn){btn.disabled=true; btn.textContent='Spinning…';}
  SFX.spin();
  try{
    const { data }=await sb.rpc("play_spin");
    if(data&&data.ok){
      (data.points>=250?SFX.jackpot():SFX.win());
      $("spinOut").innerHTML=`<div class="result">🎉 ${data.label} — +${nf(data.points)} points!</div>`;
      await loadAll();
    } else { $("spinOut").innerHTML=`<div class="muted" style="margin-top:10px">${(data&&data.error)||'No spins left.'}</div>`; }
  }catch(e){ $("spinOut").innerHTML=`<div class="muted" style="margin-top:10px">Something went wrong — try again.</div>`; }
  busy=false; renderKeepTab("play"); checkCelebrations();
}
async function doDaily(){
  if(busy||!R.daily_available) return; busy=true;
  const btn=$("dailyBtn"); if(btn){btn.disabled=true; btn.textContent='…';}
  try{
    const { data }=await sb.rpc("claim_daily");
    if(data&&data.ok){ SFX.coin(); $("dailyOut").innerHTML=`<div class="result">🎁 +${nf(data.points)} points!</div>`; await loadAll(); }
    else { $("dailyOut").innerHTML=`<div class="muted" style="margin-top:10px">${(data&&data.error)||'Already claimed today.'}</div>`; }
  }catch(e){ $("dailyOut").innerHTML=`<div class="muted" style="margin-top:10px">Try again.</div>`; }
  busy=false; renderKeepTab("play"); checkCelebrations();
}
async function redeem(id,how){
  if(busy) return; busy=true;
  const labels={giftcard:'gift card',plan_credit:'$50 off your plan',donation:'donation to your group'};
  try{
    const { data }=await sb.rpc("redeem_reward_card",{ p_card:id, p_how:how });
    if(data&&data.ok){ SFX.win(); toast('✓ Redeemed as '+(labels[how]||how)); await loadAll(); }
    else { toast((data&&data.error)||'Could not redeem'); }
  }catch(e){ toast('Try again'); }
  busy=false; renderKeepTab("rewards");
}
async function doDraw(){
  if(busy||DRAW.entered_this_month) return; busy=true;
  try{
    const { data }=await sb.rpc("enter_draw");
    if(data&&data.ok){ SFX.coin(); toast('✓ Entered the draw'); await loadAll(); }
    // open the real review page for the customer (entry already recorded regardless)
    window.open("https://g.page/r/","_blank");
  }catch(e){ toast('Try again'); }
  busy=false; renderKeepTab("draw");
}
function renderKeepTab(t){ TAB=t; render(); }

async function openInbox(){
  try{ const { data }=await sb.rpc("my_notifications"); const items=data||[];
    app.innerHTML=`<div class="top"><h1>Notifications</h1><button class="bell" onclick="render()">✕</button></div>`+
      (items.length? items.map(n=>`<div class="card"><div style="font-weight:800">${n.title||''}</div>${n.body?`<div class="muted" style="margin-top:3px">${n.body}</div>`:''}</div>`).join("")
                   : `<div class="card"><div class="muted">No notifications yet.</div></div>`);
    // mark all read
    for(const n of items){ if(!n.read) sb.rpc("mark_notification_read",{ p_id:n.id }); }
    UNREAD=0;
  }catch(e){ render(); }
}
async function signOut(){ await sb.auth.signOut(); location.href="customer-login.html"; }

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !busy){ loadAll().then(()=>{render();checkCelebrations();}).catch(()=>{}); } });
window.addEventListener("pageshow", (e)=>{ if(e.persisted && !busy){ loadAll().then(()=>{render();checkCelebrations();}).catch(()=>{}); } });
boot();
</script>
</body>
</html>
