<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Simtec — Timesheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2"></script>
<script src="auth.js?v=4" data-roles="admin,manager,office,warehouse,driver"></script>
<script src="live.js?v=3" defer></script>
<style>
  :root{ --navy:#012B60; --line:#d9dee6; --sub:#6b6a6f; --bg:#f4f6f9; --green:#1c6b34; --amber:#8a5b00; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#1c2430}
  .top{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
  .top a{color:#c9d6ea;text-decoration:none;font-size:14px}
  .top b{font-size:17px;letter-spacing:.5px}
  .wrap{max-width:900px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{margin:0 0 4px;font-size:17px}
  .muted{color:var(--sub);font-size:13px}
  .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:6px 0}
  button{font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
         background:#fff;color:var(--navy);font-size:15px;font-weight:600;padding:11px 16px}
  button.primary{background:var(--green);color:#fff;border:none}
  button.stop{background:#b4342e;color:#fff;border:none}
  button.wide{width:100%;font-size:19px;font-weight:800;padding:20px}
  button:disabled{opacity:.5;cursor:default}
  input,select{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
               border-radius:9px;width:100%;background:#fff}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);text-align:left;
     padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 6px;border-bottom:1px solid #eef1f5;font-size:14px;vertical-align:top}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .ok{background:#e7f4ec;color:var(--green)} .wait{background:#fff5e0;color:var(--amber)}
  .live{background:#e6efff;color:#123c8a}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  .err{background:#fdecec;border:1px solid #e0b4b0;color:#b4342e;border-radius:9px;padding:10px 12px;
       font-size:14px;margin-bottom:12px;display:none}
  .tot{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid #eef1f5}
  .tot b{font-size:16px}
  .weeknav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .weeknav button{padding:7px 12px;font-size:14px}
  .num{text-align:right}
  input.t{padding:7px 8px;font-size:15px;width:110px}
  button.mini{padding:5px 10px;font-size:12.5px}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .printonly{display:none}
  /* \u26a0 The office prints this every week and signs it off, so the printed
     page must be the timesheet \u2014 no navigation, no buttons, no colour blocks. */
  @media print{
    body{background:#fff}
    .top,.noprint,#mine,#crewadmin{display:none !important}
    .printonly{display:block}
    .wrap{max-width:none;padding:0}
    .card{border:none;border-bottom:1px solid #000;border-radius:0;padding:8px 0;margin:0 0 8px;break-inside:avoid}
    input.t{border:none;padding:0;font-size:13px;width:auto;background:transparent}
    .chip{border:1px solid #999;background:#fff !important;color:#000 !important}
  }
</style>
</head>
<body>

<div class="top">
  <a href="home.html" id="homeLink" style="display:none">‹ Home</a>
  <b>SIMTEC</b><span style="opacity:.75;font-size:14px">Timesheet</span>
  <span style="margin-left:auto;font-size:13px;opacity:.8" id="who"></span>
</div>

<div class="wrap">
  <div class="err" id="err"></div>
  <div id="mine"></div>
  <div id="office"></div>
  <div id="crewadmin"></div>
</div>

<script>
const sb = supabase.createClient(
  "https://jvqjoenaungubpoegyvf.supabase.co",
  "sb_publishable_J4MYTdJJyEaWe-GadpwdYA_upPT2rKw");
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const showErr = m => { const e=$("err"); e.style.display = m ? "block" : "none"; e.textContent = m||""; };
const hrs = n => (Number(n)||0).toFixed(2);
/* ⚠ ALWAYS Pacific/Auckland, never the device's own zone. Without this pin a
   laptop set to the wrong timezone - or anyone looking at the roster from
   Australia - reads every shift shifted by hours and has no way to tell. */
const NZ = "Pacific/Auckland";
const nzDate = d => new Date(d).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short",timeZone:NZ});
const nzTime = d => d ? new Date(d).toLocaleTimeString("en-NZ",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:NZ}) : "—";
/* The working day everyone is rostered for. Used only to FLAG a shift worth a
   second look - it never changes a recorded time. */
const DAY_START="08:00", DAY_END="17:00";
function todayNZ(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p;
}
/* ⚠ toISOString() CONVERTS TO UTC. In New Zealand (UTC+12) a date built at
   local midnight goes BACK A DAY when formatted that way, so "the Monday" came
   out as the Sunday — the week ran Sun–Sat and every label was a day out.
   Format the local parts instead; never round-trip a local date through UTC. */
function isoLocal(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function mondayOf(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const dow = (d.getDay()+6)%7;              // Monday = 0
  d.setDate(d.getDate()-dow);
  return isoLocal(d);
}

let ME = null, ROLE = null, OFFICE = false, WEEK = mondayOf(todayNZ()), OPEN = null;

async function boot(){
  ME = window.SIMTEC_USER || {};
  ROLE = ME.role || "";
  OFFICE = ["admin","manager","office","matt"].includes(ROLE);
  $("who").textContent = (ME.full_name || ME.email || "") + (ROLE ? " · " + ROLE : "");
  if (OFFICE) $("homeLink").style.display = "inline";
  await refresh();
}

async function refresh(){
  showErr("");
  /* ⚠ THE OFFICE DOES NOT CLOCK IN. [stated] Nigel: "Workers sign in on the
     ipad and out on the ipad ... All I need is something to replace the paper
     form they used to use." Showing the office a Clock in button and their own
     week above everybody else's was the reason the real timesheet was never
     found — it sat below two cards that did not concern them. */
  if (OFFICE) { await renderOffice(); await renderCrewAdmin(); }
  else        { await renderMine(); }
}

/* ---------------- my hours (everyone sees this) ---------------- */
async function renderMine(){
  const from = new Date(); from.setDate(from.getDate()-21);
  const { data, error } = await sb.from("v_timesheets").select("*")
    .eq("user_id", ME.id).gte("work_date", isoLocal(from))
    .order("work_date",{ascending:false}).order("clock_in",{ascending:false});
  if (error) { showErr("Couldn't load your hours: " + error.message); return; }
  const rows = data || [];
  OPEN = rows.find(r => r.open_now) || null;

  const wkStart = WEEK;
  const wkRows = rows.filter(r => mondayOf(r.work_date) === mondayOf(todayNZ()));
  const wkHours = wkRows.reduce((s,r)=> s + Number(r.hours||0), 0);

  const clockCard = OPEN ? `
    <div class="card" style="border-color:#123c8a">
      <h2>You're clocked in</h2>
      <div class="muted">Started ${nzTime(OPEN.clock_in)} · ${nzDate(OPEN.work_date)}</div>
      <div class="big" id="running">—</div>
      <label>Unpaid break (minutes)</label>
      <input id="brk" type="number" min="0" step="5" value="30" inputmode="numeric">
      <label>Note (optional)</label>
      <input id="note" placeholder="e.g. Manukau run">
      <div style="margin-top:14px"><button class="wide stop" onclick="clockOut()">Clock out</button></div>
    </div>` : `
    <div class="card">
      <h2>Not clocked in</h2>
      <div class="muted">Tap when you start work.</div>
      <div style="margin-top:14px"><button class="wide primary" onclick="clockIn()">Clock in</button></div>
    </div>`;

  const list = rows.filter(r=>!r.open_now).map(r=>`
    <tr>
      <td>${nzDate(r.work_date)}<div class="muted">${nzTime(r.clock_in)} – ${nzTime(r.clock_out)}${r.break_minutes?` · ${r.break_minutes}m break`:""}</div>
        ${r.note?`<div class="muted">${esc(r.note)}</div>`:""}</td>
      <td style="text-align:right;font-weight:700">${hrs(r.hours)}</td>
      <td style="text-align:right">${r.approved
          ? '<span class="chip ok">Approved</span>'
          : '<span class="chip wait">Waiting</span>'}</td>
    </tr>`).join("") || `<tr><td colspan="3" class="muted">Nothing in the last three weeks.</td></tr>`;

  $("mine").innerHTML = clockCard + `
    <div class="card">
      <h2>This week</h2>
      <div class="big">${hrs(wkHours)} <span style="font-size:16px;font-weight:600;color:var(--sub)">hours</span></div>
      <table><thead><tr><th>Shift</th><th style="text-align:right">Hours</th><th style="text-align:right">Status</th></tr></thead>
      <tbody>${list}</tbody></table>
    </div>
`;
  tick();
}

let TICK=null;
function tick(){
  if (TICK) clearInterval(TICK);
  if (!OPEN) return;
  const paint = () => {
    const el = $("running"); if (!el) return;
    const mins = Math.max(0, Math.floor((Date.now() - new Date(OPEN.clock_in).getTime())/60000));
    el.textContent = `${Math.floor(mins/60)}h ${String(mins%60).padStart(2,"0")}m`;
  };
  paint(); TICK = setInterval(paint, 30000);
}

async function clockIn(){
  showErr("");
  const { data, error } = await sb.rpc("timesheet_clock_in");
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  await refresh();
}
async function clockOut(){
  showErr("");
  const brk = Number(($("brk")||{}).value || 0);
  const note = (($("note")||{}).value || "").trim();
  const { data, error } = await sb.rpc("timesheet_clock_out", { p_break: brk, p_note: note });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  await refresh();
}

/* ---------------- warehouse staff (who appears on the iPad) ---------------- */

/* The truck takes the iPad. If it is late back, whoever stayed in the warehouse
   has nothing to sign out on — so the office can do it for them, at the time
   they actually left. The record says the office did it, and the run stays open
   because the other two are still out. */


/* A shift closed automatically at 8pm is a FLAG, not an answer — if the crew
   really finished at 9.15 the office puts the real times in here. Anything
   corrected goes back to unapproved so it gets looked at again. */
async function fixTimes(id, name, curIn, curOut, curBreak){
  const start = prompt("Start time for " + name + " (24-hour, e.g. 07:30)", curIn || "07:30");
  if(start === null) return;
  const end = prompt("Finish time (24-hour, e.g. 21:15)", curOut || "");
  if(end === null) return;
  const ok = t => /^\d{1,2}[:.]?\d{2}$/.test((t||"").trim());
  if(!ok(start) || !ok(end)) return showErr("Enter times as 07:30 and 21:15.");
  const tidy = t => { const m=t.trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
                      return String(m[1]).padStart(2,"0") + ":" + m[2]; };
  const br = prompt("Unpaid break, in minutes", String(curBreak || 0));
  if(br === null) return;
  const why = prompt("Why? (goes on the record)", "ran late") || null;

  const { data, error } = await sb.rpc("timesheet_office_set", {
    p_id:id, p_in:tidy(start), p_out:tidy(end), p_break:parseInt(br,10)||0, p_note:why });
  if(error) return showErr(error.message);
  if(data && data.ok === false) return showErr(data.error);
  showErr("");
  alert(name + ": " + tidy(start) + " to " + tidy(end) + " = " + data.hours + " hours. Waiting to be approved.");
  await renderOffice();
}

async function pairIpad(){
  const label = prompt("What shall we call this device?", "Warehouse iPad");
  if(label === null) return;
  const { data, error } = await sb.rpc("crew_pair_code", { p_label: label });
  if(error) return showErr(error.message);
  if(data && data.ok === false) return showErr(data.error);
  alert("Set-up code: " + data.code +
        "\n\nOn the iPad open the crew app and type this in. It lasts " +
        data.expires_in_minutes + " minutes and works once.");
}

/* Sign-on normally has to happen on the paired iPad, which is what stops
   anyone starting their day from their own phone at home. But when someone is
   late and the truck has already gone, that iPad is not in the building — so
   the office needs a way in. This is office-only, which is a stronger check
   than the device, and it writes who did it into the timesheet note. */
async function signOnFor(id, name){
  const t = prompt("What time did " + name + " start? (24-hour, e.g. 08:45)\n\nLeave blank to use right now.", "");
  if (t === null) return;
  let at = null;
  if (t.trim()) {
    const m = t.trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
    if (!m) return showErr("Enter the time as 08:45.");
    const d = new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    if (d > new Date()) return showErr("That time hasn't happened yet.");
    at = d.toISOString();
  }
  const why = prompt("Anything to note? (optional)\n\ne.g. late, truck already gone", "") || null;

  const { data, error } = await sb.rpc("crew_sign_in_for", { p_user:id, p_at:at, p_note:why });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  showErr("");
  alert(name + " signed on at " + new Date(data.signed_in_at)
        .toLocaleTimeString("en-NZ", {hour:"2-digit", minute:"2-digit"}) +
        ". They are on today's run and their hours have started.");
  await renderCrewAdmin();
  await renderOffice();
}

async function signOutFor(id, name){
  const t = prompt("What time did " + name + " finish? (24-hour, e.g. 16:30)\n\nLeave blank to use right now.", "");
  if (t === null) return;                       // cancelled
  let at = null;
  if (t.trim()) {
    const m = t.trim().match(/^(\d{1,2})[:.]?(\d{2})$/);
    if (!m) return showErr("Enter the time as 16:30.");
    const d = new Date();
    d.setHours(+m[1], +m[2], 0, 0);
    if (d > new Date()) return showErr("That time hasn't happened yet.");
    at = d.toISOString();
  }
  const why = prompt("Anything to note? (optional)\n\ne.g. truck late back, signed out on their behalf", "") || null;

  const { data, error } = await sb.rpc("crew_sign_out_for", { p_user:id, p_at:at, p_note:why });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  showErr("");
  alert(name + " signed out at " + new Date(data.signed_out_at)
        .toLocaleTimeString("en-NZ", {hour:"2-digit", minute:"2-digit"}) +
        ". The run stays open while the truck is still out.");
  await renderCrewAdmin();
  await renderOffice();
}

async function renderCrewAdmin(){
  const { data, error } = await sb.rpc("crew_list");
  if(error){ $("crewadmin").innerHTML = `<div class="card"><div class="muted">Couldn't load the crew list: ${esc(error.message)}</div></div>`; return; }
  const crew = data || [];
  $("crewadmin").innerHTML = `
    <div class="card">
      <h2>Warehouse staff</h2>
      <div class="muted">Anyone here gets their own Sign in / Sign out button on the warehouse iPad.
        They never need a password - a 6-digit code goes to their email when they tap their name.</div>
      <div class="muted" style="margin-top:8px">
        Sign-on works on the paired iPad only, so nobody can start their day from their own phone.
        If someone is late and the truck has gone, use <b>Sign on</b> beside their name — it puts them on
        today's run and starts their hours, and records that the office did it.
        <button class="mini" style="margin-left:6px" onclick="pairIpad()">Set up a device</button>
      </div>

      ${crew.length ? `<table style="margin-top:12px">
        <thead><tr><th>Name</th><th>Email</th><th>Right now</th><th></th></tr></thead><tbody>
        ${crew.map(c=>`<tr>
          <td style="font-weight:600">${esc(c.name)}</td>
          <td class="muted">${esc(c.email)}</td>
          <td>${c.on_now ? '<span class="chip ok">On since '+nzTime(c.signed_in_at)+'</span>'
                          : '<span class="muted">not signed on</span>'}</td>
          <td style="text-align:right"><button style="padding:6px 11px;font-size:12.5px"
              onclick="removeCrew('${c.user_id}','${esc(c.name).replace(/'/g,"\\'")}')">Remove</button>
            ${c.on_now ? `<button class="mini" style="margin-left:6px"
              onclick="signOutFor('${c.user_id}','${esc(c.name).replace(/'/g,"\\'")}')">Sign out</button>`
            : `<button class="mini" style="margin-left:6px"
              onclick="signOnFor('${c.user_id}','${esc(c.name).replace(/'/g,"\\'")}')">Sign on</button>`}</td>
        </tr>`).join("")}</tbody></table>`
      : '<div class="muted" style="margin-top:10px">Nobody set up yet - add your first warehouse person below.</div>'}

      <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
        <div class="row">
          <div><label>Name</label><input id="cwName" placeholder="Tama Reihana"></div>
          <div><label>Email</label><input id="cwEmail" type="email" inputmode="email" placeholder="tama@simtectp.com"></div>
        </div>
        <div style="margin-top:12px"><button class="primary" onclick="addCrew()">Add to the iPad</button></div>
        <div class="muted" style="margin-top:8px">They will appear on the iPad straight away - no email is sent until they tap their own name.</div>
      </div>
    </div>`;
}

async function addCrew(){
  showErr("");
  const name=($("cwName").value||"").trim(), email=($("cwEmail").value||"").trim();
  if(!name || !email) return showErr("Name and email are both needed.");
  const { data:{ session } } = await sb.auth.getSession();
  const { data, error } = await sb.functions.invoke("manage-users", {
    body:{ action:"crew-add", full_name:name, email },
    headers:{ "x-user-token": session ? session.access_token : "" } });
  if(error) return showErr(error.message);
  if(data && data.error) return showErr(data.error);
  $("cwName").value=""; $("cwEmail").value="";
  await renderCrewAdmin();
}

async function removeCrew(id, name){
  if(!confirm(`Take ${name} off the iPad? Their hours already recorded are kept.`)) return;
  showErr("");
  const { data:{ session } } = await sb.auth.getSession();
  const { data, error } = await sb.functions.invoke("manage-users", {
    body:{ action:"crew-set-active", id, active:false },
    headers:{ "x-user-token": session ? session.access_token : "" } });
  if(error) return showErr(error.message);
  if(data && data.error) return showErr(data.error);
  await renderCrewAdmin();
}

/* ============================ THE WEEK ======================================
   \u26a0\u26a0 WHY THIS WAS REBUILT (4 Sep 2026).
   [stated] Nigel: "The reason nothing has been approved is its not user
   friendly so the office reverted back to the old paper timesheets."
   ALL 24 TIMESHEETS WERE UNAPPROVED. The page showed a flat list of every
   shift by everybody AND a per-person picker underneath, so the office had two
   competing views and no obvious next action. A screen nobody can use is a
   screen nobody uses.

   THIS SHOWS: one block per person, Monday to Sunday, every field editable
   where it sits, a weekly total, and one button to approve the week.
   Pay is weekly, so the week is the unit \u2014 not the shift, and not the day.

   \u26a0 EVERY DAY IS SHOWN, including days with nothing on them. A missing day is
     exactly what the office needs to notice, and a blank row invites the fix.
   \u26a0 WAREHOUSE STAFF ONLY. Consultants and the office do not clock in, and
     Cherelee's hours are entered by hand in Australia. [stated] Nigel:
     "I dont need anything for Cherelee, just the 4 warehouse staff."
   ========================================================================== */
function weekEnd(ws){ const d=new Date(ws+"T00:00:00"); d.setDate(d.getDate()+6); return isoLocal(d); }
function shiftWeek(n){ const d=new Date(WEEK+"T00:00:00"); d.setDate(d.getDate()+7*n); WEEK=isoLocal(d); renderOffice(); }

const DAYNAME = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

async function renderOffice(){
  /* ⚠⚠ DO NOT QUERY `profiles` FOR OTHER PEOPLE. Its only SELECT policy is
     `auth.uid() = id` — you may read YOUR OWN row and nobody else's. Reading it
     here returned an empty list, so the page drew no staff blocks and a grand
     total of 0.00 hours while the data sat there perfectly.
     ⚠ crew_list() is SECURITY DEFINER and is the supported way to get them.
       Same trap as the crew names on the truck view, hours earlier. */
  const { data: staff, error: se } = await sb.rpc("crew_list");
  if (se) { showErr("Couldn't load staff: " + se.message); return; }

  const { data, error } = await sb.from("v_timesheets").select("*")
    .gte("work_date", WEEK).lte("work_date", weekEnd(WEEK))
    .order("work_date");
  if (error) { showErr("Couldn't load timesheets: " + error.message); return; }
  const rows = data || [];

  /* \u26a0 Somebody with no timesheets at all must still appear, or a week where
     a person forgot to sign on every day looks like a week they did not exist. */
  const people = (staff||[])
    .map(p => ({ id:p.user_id, name: p.name || p.email || "\u2014" }))
    .sort((a,b) => a.name.localeCompare(b.name));

  const weekLabel = `${nzDate(WEEK)} \u2013 ${nzDate(weekEnd(WEEK))}`;
  let grand = 0, anyToApprove = false;

  const blocks = people.map(p => {
    const mine = rows.filter(r => r.user_id === p.id);
    let total = 0, waiting = 0, openNow = 0;

    const dayRows = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(WEEK + "T12:00:00"); d.setDate(d.getDate() + i);
      const iso = isoLocal(d);
      const shifts = mine.filter(r => r.work_date === iso);

      if (!shifts.length) {
        dayRows.push(`<tr>
          <td><b>${DAYNAME[i]}</b> <span class="muted">${nzDate(iso)}</span></td>
          <td colspan="3" class="muted">nothing recorded</td>
          <td class="num muted">\u2014</td>
          <td class="num"></td>
        </tr>`);
        continue;
      }

      shifts.forEach((r, ix) => {
        total += Number(r.hours||0);
        if (r.open_now) openNow++;
        else if (!r.approved) { waiting++; anyToApprove = true; }

        /* \u26a0 FLAGS, NEVER CORRECTIONS. These say "worth a look" \u2014 they must not
           imply the system knows what the person actually did. */
        const flags = [];
        if (r.open_now)      flags.push('<span class="chip live">still signed on</span>');
        if (r.auto_closed)   flags.push('<span class="chip wait">closed at 8pm by the system \u2014 check</span>');
        if (r.source==="manual") flags.push('<span class="chip wait">added by hand</span>');
        if (shifts.length>1 && ix===0) flags.push('<span class="chip wait">'+shifts.length+' shifts this day</span>');
        if (Number(r.hours||0) > 11) flags.push('<span class="chip wait">long day</span>');

        const inV  = (r.clock_in ||"").slice(11,16);
        const outV = (r.clock_out||"").slice(11,16);

        dayRows.push(`<tr>
          <td><b>${DAYNAME[i]}</b> <span class="muted">${nzDate(iso)}</span>
            ${flags.length?`<div style="margin-top:4px">${flags.join(" ")}</div>`:""}
            ${r.note?`<div class="muted">${esc(r.note)}</div>`:""}</td>
          <td><input class="t" type="time" value="${r.started_nz||inV||""}"
                     onchange="saveCell('${r.id}',this,'in')"></td>
          <td>${r.open_now
                ? '<span class="muted">still on</span>'
                : `<input class="t" type="time" value="${r.finished_nz||outV||""}"
                          onchange="saveCell('${r.id}',this,'out')">`}</td>
          <td><input class="t" type="number" min="0" step="5" value="${r.break_minutes||0}"
                     onchange="saveCell('${r.id}',this,'break')" style="width:70px"></td>
          <td class="num"><b>${r.open_now?"\u2014":hrs(r.hours)}</b></td>
          <td class="num">${r.approved?'<span class="chip ok">approved</span>':""}</td>
        </tr>`);
      });
    }

    grand += total;
    return `
    <div class="card person">
      <div class="phead">
        <div><h2 style="margin:0">${esc(p.name)}</h2>
          <div class="muted">${waiting?`${waiting} shift${waiting==1?"":"s"} to approve`:"nothing waiting"}${openNow?" \u00b7 signed on now":""}</div>
        </div>
        <div style="text-align:right">
          <div class="big" style="font-size:28px;margin:0">${hrs(total)}</div>
          <div class="muted">hours this week</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Day</th><th>Started</th><th>Finished</th><th>Break</th>
          <th class="num">Hours</th><th class="num"></th></tr></thead>
        <tbody>${dayRows.join("")}</tbody>
      </table>
      <div class="row noprint" style="margin-top:12px">
        <button class="primary" ${waiting?"":"disabled"}
          onclick="approveWeek('${p.id}','${esc(p.name)}')">Approve ${esc(p.name)}'s week</button>
      </div>
    </div>`;
  }).join("");

  $("office").innerHTML = `
    <div class="card noprint">
      <div class="weeknav">
        <button onclick="shiftWeek(-1)">\u2039 Previous</button>
        <div style="flex:1;text-align:center"><b>${weekLabel}</b></div>
        <button onclick="shiftWeek(1)">Next \u203a</button>
      </div>
      <div class="row">
        <button onclick="window.print()">Print this week</button>
        ${anyToApprove?'<button class="primary" onclick="approveEveryone()">Approve everyone</button>':""}
      </div>
    </div>

    <div class="printonly" style="margin-bottom:12px">
      <h2 style="margin:0">Simtec \u2014 warehouse timesheets</h2>
      <div class="muted">${weekLabel}</div>
    </div>

    ${people.length ? blocks : '<div class="card muted">No warehouse staff on file.</div>'}

    <div class="card"><div class="tot"><span><b>Everyone</b></span><b>${hrs(grand)} h</b></div></div>`;
}

/* \u26a0 SAVE THE WHOLE ROW, NOT THE ONE FIELD. timesheet_office_set takes start,
   finish and break together \u2014 sending only the changed one would blank the
   other two. The values are read back off the row that was edited. */
async function saveCell(id, el, which){
  showErr("");
  const tr = el.closest("tr");
  const ins = tr.querySelectorAll("input.t");
  const inV = ins[0] ? ins[0].value : null;
  const outV = (ins.length > 2) ? ins[1].value : null;   // no finish input on an open shift
  const brV  = ins[ins.length-1] ? Number(ins[ins.length-1].value||0) : 0;

  if (which !== "break" && (!inV || (ins.length > 2 && !outV))) {
    showErr("A shift needs a start and a finish time."); return;
  }
  el.disabled = true;
  const { data, error } = await sb.rpc("timesheet_office_set",
    { p_id:id, p_in:inV, p_out:outV, p_break:brV, p_note:null });
  el.disabled = false;
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  await renderOffice();
}


async function approveWeek(userId, name){
  showErr("");
  const { data, error } = await sb.rpc("timesheet_approve_week",
    { p_user:userId, p_week_start:WEEK, p_approved:true });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  /* \u26a0 SAY WHAT WAS SKIPPED. An open shift cannot be approved, and silence
     would look like the button had failed. */
  if (data && data.still_open) {
    showErr(`${name}: ${data.approved} approved. ${data.still_open} shift${data.still_open==1?" is":"s are"} still signed on and cannot be approved until they sign off.`);
  }
  await renderOffice();
}

async function approveEveryone(){
  const { data: staff } = await sb.rpc("crew_list");
  for (const p of (staff||[])) {
    await sb.rpc("timesheet_approve_week", { p_user:p.user_id, p_week_start:WEEK, p_approved:true });
  }
  await renderOffice();
}

async function approve(id, yes){
  showErr("");
  const { data, error } = await sb.rpc("timesheet_approve", { p_id:id, p_approved:yes });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  await refresh();
}

async function approve(id, yes){
  showErr("");
  const { data, error } = await sb.rpc("timesheet_approve", { p_id: id, p_approved: yes });
  if (error) return showErr(error.message);
  if (data && data.ok === false) return showErr(data.error);
  await refresh();
}

/* auth.js sets window.SIMTEC_USER before this runs on a normal load; if it
   hasn't yet (slow profile read), wait for it rather than showing nothing. */
(function start(){
  if (window.SIMTEC_USER) return boot();
  let n = 0;
  const t = setInterval(() => { if (window.SIMTEC_USER || ++n > 40) { clearInterval(t); boot(); } }, 150);
})();
</script>
