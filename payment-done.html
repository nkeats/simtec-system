<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simtec — Payment</title>
<style>
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#f4f7fb;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(1,43,96,.12);padding:38px 34px;max-width:420px;text-align:center}
  .big{font-size:56px}
  h1{color:#012B60;font-size:22px;margin:12px 0 8px}
  p{color:#51607a;font-size:15px;line-height:1.5;margin:0}
</style>
</head>
<body>
  <div class="card">
    <div class="big" id="icon">✅</div>
    <h1 id="ttl">Payment received — thank you!</h1>
    <p id="msg">You can close this tab and head back to the order on the iPad. The payment has been recorded automatically.</p>
  </div>
<script>
  if(new URLSearchParams(location.search).get('ok')==='0'){
    document.getElementById('icon').textContent='✖️';
    document.getElementById('ttl').textContent='Payment cancelled';
    document.getElementById('msg').textContent='No charge was made. Close this tab and return to the order — you can try the payment again from there.';
  }
</script>
</body>
</html>
