<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simtec — My Account</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e2038">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simtec">

<style>
  :root{ --navy:#0e2038; --navy2:#16304f; --gold:#c9a84c; --ink:#0e1726; --paper:#f4f6f9; --line:#dfe5ec; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:24px 18px 60px;min-height:100vh}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 22px}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--navy);color:var(--gold);
       display:grid;place-items:center;font-weight:800;font-size:18px}
  .brand b{font-size:20px;letter-spacing:.5px;color:var(--navy)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(14,32,56,.06)}
  h1{font-size:22px;margin:2px 0 6px}
  p.lead{color:#51617a;margin:0 0 18px;line-height:1.5}
  label{display:block;font-size:13px;font-weight:600;color:#42506a;margin:0 0 6px}
  input[type=tel]{width:100%;padding:15px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;outline:none}
  input[type=tel]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
  .btn{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:var(--navy);color:#fff;
       font-size:16px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.55}
  .btn.gold{background:var(--gold);color:var(--navy)}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .muted{font-size:12.5px;color:#7a889c;margin-top:14px;line-height:1.5;text-align:center}
  .ok{background:#0f7b3f;color:#fff;border-radius:12px;padding:16px;text-align:center;font-weight:600}
  .err{color:#b3261e;font-size:13.5px;margin-top:10px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:#51617a;font-size:14px}
  .row .v{font-weight:700}
  .bar{height:10px;border-radius:99px;background:#eef1f5;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:var(--gold)}
  .hi{font-size:24px;font-weight:800;color:var(--navy);margin:0 0 2px}
  .spin{display:inline-block;width:20px;height:20px;border:3px solid #dfe5ec;border-top-color:var(--navy);
        border-radius:50%;animation:s .8s linear infinite;vertical-align:-4px}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark">S</span><b>SIMTEC</b></div>
  <div id="view" class="card"><div class="center"><span class="spin"></span></div></div>
  <div class="muted">Simtec Therapeutic Ltd · your account is private to you</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL="https://jvqjoenaungubpoegyvf.supabase.co";
const SUPA_KEY="sb_publishable_J4MYTdJJyEaWe-GadpwdYA_upPT2rKw";
const FN_URL = SUPA_URL + "/functions/v1/customer-magiclink";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ persistSession:true, detectSessionInUrl:false }   // we verify the one-time token ourselves (works cross-device)
});
const $=id=>document.getElementById(id);
const view=$("view");
const money=n=>"$"+(Number(n||0)).toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function boot(){
  // 1) one-time sign-in token from a QR scan or an emailed link (?token=...)
  const token = new URLSearchParams(location.search).get("token");
  if(token){
    view.innerHTML=`<div class="center"><span class="spin"></span></div>`;
    const { error } = await sb.auth.verifyOtp({ token_hash: token, type: "email" });
    history.replaceState(null,"",location.pathname);   // strip the token from the address bar
    if(!error){ return wantsAccount()?showAccount():goRewards(); }
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ return wantsAccount()?showAccount():goRewards(); }
  showLogin();
}

function showLogin(){
  view.innerHTML=`
    <h1>My Simtec account</h1>
    <p class="lead">Enter the mobile number on your Simtec order and we'll text you a 6-digit code to sign in. No password needed.</p>
    <label for="mob">Mobile number</label>
    <input id="mob" type="tel" inputmode="tel" placeholder="021 234 5678" autocomplete="tel">
    <button id="send" class="btn">Text me a code</button>
    <div id="msg"></div>`;
  $("send").onclick=async()=>{
    const mobile=$("mob").value.trim();
    if(mobile.replace(/\D/g,"").length<8){ $("msg").innerHTML='<div class="err">Please enter a valid mobile number.</div>'; return; }
    $("send").disabled=true; $("send").innerHTML='<span class="spin"></span>';
    try{
      await fetch(FN_URL,{ method:"POST", headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY },
        body:JSON.stringify({ mode:"request-code", mobile }) });
    }catch(e){}
    showCodeEntry(mobile);
  };
}
function showCodeEntry(mobile){
  view.innerHTML=`
    <h1>Enter your code</h1>
    <p class="lead">If ${esc(mobile)} is on a Simtec order, we've texted a 6-digit code. Enter it below.</p>
    <label for="code">6-digit code</label>
    <input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" style="letter-spacing:8px;text-align:center;font-size:22px">
    <button id="go" class="btn">Sign in</button>
    <button class="btn ghost" onclick="location.href=location.pathname">Use a different number</button>
    <div id="msg"></div>`;
  $("go").onclick=async()=>{
    const code=$("code").value.trim();
    if(!/^\d{4,8}$/.test(code)){ $("msg").innerHTML='<div class="err">Enter the code from the text.</div>'; return; }
    $("go").disabled=true; $("go").innerHTML='<span class="spin"></span>';
    let out={};
    try{
      const r=await fetch(FN_URL,{ method:"POST", headers:{ "Content-Type":"application/json", "apikey":SUPA_KEY },
        body:JSON.stringify({ mode:"verify-code", mobile, code }) });
      out=await r.json().catch(()=>({}));
    }catch(e){}
    if(out && out.ok && out.token){
      const { error } = await sb.auth.verifyOtp({ token_hash: out.token, type:"email" });
      if(!error){ return wantsAccount()?showAccount():goRewards(); }
      $("msg").innerHTML='<div class="err">Sign-in failed, please try again.</div>';
    } else {
      $("msg").innerHTML='<div class="err">'+esc((out&&out.error)||"That code isn't right.")+'</div>';
    }
    $("go").disabled=false; $("go").textContent="Sign in";
  };
}

function wantsAccount(){ return new URLSearchParams(location.search).has("account"); }
function goRewards(){ location.replace("rewards.html"); }
async function showAccount(){
  view.innerHTML=`<div class="center"><span class="spin"></span></div>`;
  // Everything below returns ONLY this customer's own rows (row-level security).
  const { data:me } = await sb.from("sim_customers").select("first_name,last_name,affiliation_id,donate_to_affiliation").limit(1).maybeSingle();
  const { data:order } = await sb.from("sim_orders")
      .select("contract_value,amount_paid_to_date,order_status").order("order_date",{ascending:false}).limit(1).maybeSingle();

  const name = me ? esc([me.first_name,me.last_name].filter(Boolean).join(" ")) : "there";
  let progress="";
  if(order){
    const total=Number(order.contract_value||0), paid=Number(order.amount_paid_to_date||0);
    const pct= total>0 ? Math.min(100, Math.round(paid/total*100)) : 0;
    progress=`
      <div class="row"><span class="k">Your plan</span><span class="v">${money(total)}</span></div>
      <div class="row"><span class="k">Paid so far</span><span class="v">${money(paid)}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="muted" style="text-align:left;margin-top:8px">${pct}% of the way there${order.order_status?` · ${esc(order.order_status)}`:""}</div>`;
  } else {
    progress=`<p class="lead">We couldn't find an active plan on your account yet. If you've just ordered, check back soon.</p>`;
  }
  let groupHTML="";
  if(me && me.affiliation_id){
    const { data:grp } = await sb.from("affiliations").select("name,status").eq("id",me.affiliation_id).maybeSingle();
    if(grp && grp.status==="active"){   // donate option ONLY for members of an actively-signed group
      groupHTML=`<div class="row"><span class="k">Your group</span><span class="v">${esc(grp.name)}</span></div>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)">
        <span class="k" style="font-size:14px">Donate my rewards to ${esc(grp.name)}</span>
        <input type="checkbox" id="donate" ${me.donate_to_affiliation?"checked":""} style="width:22px;height:22px;accent-color:var(--gold)">
      </label>`;
    }
  }
  view.innerHTML=`
    <p class="hi">Welcome back, ${name.split(" ")[0]||"there"} 👋</p>
    <p class="lead">This is your private Simtec account.</p>
    ${progress}
    ${groupHTML}
    <button class="btn gold" style="margin-top:18px" disabled>🎮 Rewards game — coming soon</button>
    <button class="btn ghost" id="out">Sign out</button>`;
  $("out").onclick=async()=>{ await sb.auth.signOut(); location.href=location.pathname; };
  const dt=$("donate"); if(dt) dt.onchange=async()=>{ try{ await sb.rpc("set_my_affiliation_optin",{p_optin:dt.checked}); }catch(e){} };
}

sb.auth.onAuthStateChange((_e,session)=>{ if(session && wantsAccount()) showAccount(); });
boot();
</script>
</body>
</html>
