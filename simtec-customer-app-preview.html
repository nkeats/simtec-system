function Ring({ value, size=128, stroke=12, color=C.cyan, children }) {
  const r=(size-stroke)/2, circ=2*Math.PI*r; const [off,setOff]=useState(circ);
  useEffect(()=>{ const t=setTimeout(()=>setOff(circ*(1-value)),150); return ()=>clearTimeout(t); },[value,circ]);
  return <div style={{ position:"relative", width:size, height:size }}><svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,.14)" strokeWidth={stroke}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} style={{ transition:"stroke-dashoffset 1.2s cubic-bezier(.34,1.3,.5,1)", filter:`drop-shadow(0 0 6px ${color})` }}/></svg><div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>{children}</div></div>;
}

    <div style={{ background:"linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.04))", border:"1px solid rgba(255,255,255,.16)", borderRadius:22, padding:"12px 14px 8px", boxShadow:"inset 0 1px 0 rgba(255,255,255,.18)" }}>

          <div style={{ position:"absolute", inset:0, zIndex:56, background:"radial-gradient(120% 70% at 50% 0%, #FFB43D, #FF4E9B 55%, #2A0E52)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px", textAlign:"center", overflow:"hidden" }}>
            <div style={{ position:"relative", width:200, height:200, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <svg width="200" height="200" viewBox="0 0 200 200" style={{ position:"absolute", animation:"spin360 12s linear infinite" }}>{[...Array(16)].map((_,i)=><rect key={i} x="96" y="4" width="8" height="42" rx="4" fill={i%2?"rgba(255,210,63,.7)":"rgba(255,255,255,.4)"} transform={`rotate(${i*22.5} 100 100)`}/>)}</svg>
              <div className="pop" style={{ fontSize:96, filter:"drop-shadow(0 8px 22px rgba(255,180,0,.6))" }}>🎉</div>
            </div>
            <div className="pop" style={{ color:"#FFD23F", fontWeight:900, fontSize:14, letterSpacing:3, marginTop:2 }}>MONTHLY DRAW WINNER</div>
            <div style={{ color:"#fff", fontWeight:900, fontSize:30, lineHeight:1.1, marginTop:6 }}>You won, {me.name}! 🏆</div>
            <div style={{ color:"#FFD23F", fontWeight:900, fontSize:22, marginTop:10 }}>+{cfg.drawPts.toLocaleString()} points</div>
            <div style={{ color:"rgba(255,255,255,.95)", fontSize:14, fontWeight:600, lineHeight:1.5, marginTop:14, maxWidth:290 }}>Your name came out of this month's draw — the points are already in your account. Ka pai! 🎉</div>
            <button onClick={()=>setStarburst(false)} className="pulse" style={{ ...btn3d("#fff","#C9A100"), color:"#3A2000", padding:"14px 44px", fontSize:17, fontWeight:900, marginTop:22 }}>Claim & celebrate! 🎉</button>
          </div>
        )}

        {/* OFFICE SETTINGS overlay */}
        {cfgOpen && (
          <div style={{ position:"absolute", inset:0, zIndex:55, background:"rgba(8,5,26,.96)", display:"flex", flexDirection:"column", padding:"20px 18px", overflowY:"auto" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:4 }}><div style={{ display:"flex", alignItems:"center", gap:8 }}><Settings size={18} color={C.yellow}/><span style={{ color:C.white, fontWeight:900, fontSize:18 }}>Office settings</span></div><button onClick={()=>setCfgOpen(false)} style={{ background:"rgba(255,255,255,.12)", border:"none", borderRadius:12, width:34, height:34, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }}><X size={18} color="#fff"/></button></div>
            <div style={{ color:C.sub, fontSize:12, fontWeight:600, marginBottom:14 }}>Tune the whole economy from here — changes show live in the app. (Demo only; your real system isn't touched.)</div>
            <div style={{ ...glass, padding:"4px 16px 12px" }}>
              <CfgRow label="Points per direct‑debit payment" k="payPts" />
              <CfgRow label="Extra‑payment threshold" k="extraMin" prefix="$" />
              <CfgRow label="Points for an extra payment" k="extraPts" />
              <CfgRow label="Points for a referral that buys" k="refPts" />
              <CfgRow label="Points per $50 reward card" k="cardEvery" />
              <CfgRow label="Monthly review‑draw prize (pts)" k="drawPts" />
              <CfgRow label="Free spins per payment" k="spinsPerPay" />
              <CfgRow label="Clean payments for early delivery" k="cleanRun" />
              <CfgRow label="Early‑delivery deposit (%)" k="depositPct" />
              <CfgRow label="Daily bonus — minimum pts" k="dailyMin" />
              <CfgRow label="Daily bonus — maximum pts" k="dailyMax" />
            </div>
            <div style={{ ...glass, padding:"12px 16px", marginTop:12 }}><div style={{ ...eyebrow, marginBottom:8 }}>Monthly draw (demo)</div><div style={{ color:C.sub, fontSize:11.5, fontWeight:600, lineHeight:1.5, marginBottom:10 }}>In the real app the draw runs automatically on the 1st and lights up on everyone's phone. Trigger it here to see it now.</div><div style={{ display:"flex", flexDirection:"column", gap:8 }}><button onClick={()=>{ setDrawResult({ name:me.name, suburb:me.suburb, pts:cfg.drawPts, isMe:true }); setPts(p=>p+cfg.drawPts); setStarburst(true); setCfgOpen(false); }} style={{ ...btn3d("linear-gradient(120deg,#FFD23F,#FF8A3D)","#C88A00"), padding:"12px 14px", fontSize:13.5, color:"#3A2000" }}>🏆 Run draw — I win (starburst + points)</button><button onClick={()=>{ const w=BOARD[Math.floor(Math.random()*BOARD.length)]; setDrawResult({ name:w.name, suburb:w.suburb, pts:cfg.drawPts, isMe:false }); setCfgOpen(false); }} style={{ ...btn3d("rgba(255,255,255,.18)","rgba(0,0,0,.2)"), padding:"12px 14px", fontSize:13.5 }}>🎟️ Run draw — someone else wins</button><button onClick={()=>{ setDrawResult(null); setStarburst(false); }} style={{ ...btn3d("rgba(255,255,255,.1)","rgba(0,0,0,.2)"), padding:"10px 14px", fontSize:12.5, color:C.sub }}>Clear draw result</button></div></div>
            <button onClick={()=>setCfgOpen(false)} style={{ ...btn3d(C.yellow,"#C88A00"), padding:14, fontSize:15, color:"#3A2000", marginTop:14 }}>Done</button>
          </div>
        )}

        {toast && <div style={{ position:"absolute", bottom:92, left:16, right:16, zIndex:70, background:"linear-gradient(120deg,#FF2D78,#FF6A3D)", color:"#fff", borderRadius:14, padding:"13px 14px", fontSize:14, textAlign:"center", fontWeight:800, boxShadow:"0 10px 30px rgba(255,45,120,.5)" }}>{toast}</div>}

        <div style={{ position:"absolute", bottom:14, left:14, right:14, zIndex:10, background:"rgba(24,14,54,.92)", backdropFilter:"blur(12px)", border:"1px solid rgba(255,255,255,.14)", borderRadius:26, display:"flex", padding:"8px 6px", boxShadow:"0 12px 30px rgba(0,0,0,.55)" }}>{[["home","Home",Home],["points","Points",Star],["refer","Refer",Zap],["rating","Rating",Award],["loot","Loot",Gift]].map(([id,lbl,Icon])=><button key={id} onClick={()=>setTab(id)} style={{ flex:1, background:"none", border:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}><div style={{ width:34, height:34, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", background:tab===id?"linear-gradient(135deg,#FFD23F,#FF8A3D)":"transparent", boxShadow:tab===id?"0 4px 12px rgba(255,138,61,.55)":"none", transition:"background .2s" }}><Icon size={19} color={tab===id?"#3A2000":C.sub} fill={tab===id&&id==="points"?"#3A2000":"none"}/></div><span style={{ fontSize:9.5, color:tab===id?C.yellow:C.sub, fontWeight:tab===id?900:600 }}>{lbl}</span></button>)}</div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
