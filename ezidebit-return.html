<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezidebit — completing…</title>
<style>
  html,body{margin:0;height:100%;background:#fafbfd;color:#1f2733;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{height:100%;display:grid;place-items:center;text-align:center;padding:24px;}
  .ok{font-size:44px}
  h1{font-size:19px;color:#1c2a5e;margin:12px 0 6px}
  p{font-size:14px;color:#6b7685;margin:0 auto;max-width:380px;line-height:1.55}
  a.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:12px;
    background:#0e2038;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="ok">✅</div>
    <h1>Direct debit received</h1>
    <p id="msg">Taking you back to the order…</p>
    <a class="btn" id="back" href="order-app.html" style="display:none">Back to the order</a>
  </div>
</div>
<script>
/* Ezidebit sends the customer here (cMethod=GET) with the result in the query
   string, after the whole page went to their form — there is no iframe any more.

   This page's only job is to hand the result to the order app and send the
   consultant back. Same origin, so localStorage is the same store the app reads.
   ⚠ It must NEVER dead-end: if anything at all fails there is a visible button,
   because the alternative is a consultant stranded in a customer's lounge. */
(function(){
  var params={};
  try{ new URLSearchParams(location.search).forEach(function(v,k){ params[k]=v; }); }catch(e){}

  var back = 'order-app.html';
  try{ back = new URL('order-app.html', location.href).href; }catch(e){}
  var btn=document.getElementById('back'), msg=document.getElementById('msg');

  try{
    localStorage.setItem('simtec_ezidebit_return',
      JSON.stringify({ __simtec:'ezidebit-return', at:Date.now(), params:params }));
  }catch(e){
    // Storage refused. The order app can still be told by the office; don't pretend.
    msg.textContent='Direct debit complete, but this iPad would not let us pass the '
      + 'details back automatically. Tap below, then tell the office before you leave.';
    btn.style.display='inline-block';
    return;
  }

  // Old behaviour kept for safety: if this ever loads inside a frame again, the
  // parent still gets told rather than nothing happening at all.
  try{
    if(window.parent && window.parent!==window){
      window.parent.postMessage({__simtec:'ezidebit-return', params:params}, location.origin);
    }
  }catch(e){}

  btn.style.display='inline-block';
  setTimeout(function(){ try{ location.replace(back); }catch(e){ location.href=back; } }, 900);
})();
</script>
</body>
</html>
