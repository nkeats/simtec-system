<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Simtec — Driver</title>
<!-- Home Screen icon + standalone launch. Same coin icon files already at the
     repo root that the Sales App and Games App use — no new assets.
     Deliberately NO manifest.json link: that manifest belongs to the Games App
     and its start_url is rewards.html, which would send the iPad to the wrong
     page when launched from the Home Screen. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simtec Delivery">
<meta name="theme-color" content="#012B60">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --navy:#012B60; --line:#d9dee6; --sub:#6b6a6f; --bg:#f4f6f9; --green:#1c6b34;
         --amber:#8a5b00; --red:#b4342e; --blue:#123c8a; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);
       color:#1c2430;-webkit-text-size-adjust:100%}
  .top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;
       position:sticky;top:0;z-index:5}
  .top b{font-size:16px;letter-spacing:.5px}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 6px;font-size:16px}
  .muted{color:var(--sub);font-size:13px}
  button{font-family:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);
         background:#fff;color:var(--navy);font-size:15px;font-weight:600;padding:12px 15px}
  button.primary{background:var(--green);color:#fff;border:none}
  button.blue{background:var(--blue);color:#fff;border:none}
  button.warn{background:var(--amber);color:#fff;border:none}
  button.stop{background:var(--red);color:#fff;border:none}
  button.wide{width:100%;font-size:18px;font-weight:800;padding:18px;margin-top:8px}
  button:disabled{opacity:.5}
  input,select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
        border-radius:10px;width:100%;background:#fff}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .ok{background:#e7f4ec;color:var(--green)} .wait{background:#fff5e0;color:var(--amber)}
  .go{background:#e6efff;color:var(--blue)} .bad{background:#fdecec;color:var(--red)}
  .stopcard{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eef1f5}
  .seq{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
       align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 auto}
  .seq.done{background:var(--green)} .seq.failed{background:var(--red)} .seq.now{background:var(--blue)}
  .err{background:#fdecec;border:1px solid #e0b4b0;color:var(--red);border-radius:10px;padding:11px;
       font-size:14px;margin-bottom:12px;display:none}
  .banner{background:#e6efff;border:1px solid #b9cdf0;color:var(--blue);border-radius:10px;padding:10px 12px;
          font-size:13px;margin-bottom:12px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .row>*{flex:1}
  .tick{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eef1f5;font-size:15px}
  .tick input{width:24px;height:24px;flex:0 0 auto}
  canvas{border:1px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:150px}
  a.call{color:var(--blue);font-weight:700;text-decoration:none}
  /* The address and phone are what the driver reads at arm's length in a truck,
     often in bright sun. They get to be the biggest things on the screen. */
  .bigaddr{font-size:22px;line-height:1.3;font-weight:700;color:#111a2e;margin:8px 0 2px}
  .bigsub{font-size:17px;color:#3d4a63;margin-bottom:12px}
  .telwho{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4a6ea8;margin-bottom:2px}
  .bigtel{display:block;font-size:26px;font-weight:800;letter-spacing:.5px;color:#0b3d91;
          text-decoration:none;padding:12px 14px;border:2px solid #cfe0ff;border-radius:12px;
          background:#f2f7ff;text-align:center;margin-bottom:10px}
  .nav{display:block;text-align:center;background:#1c6b34;color:#fff;font-weight:800;font-size:18px;
       padding:15px;border-radius:12px;text-decoration:none;margin-bottom:6px}
  .navalt{display:block;text-align:center;color:#3d4a63;font-size:13.5px;text-decoration:none;
          padding:6px;margin-bottom:6px}
  .gps{font-size:11px;color:var(--sub)}
</style>
</head>
<body>

<div class="top">
  <b>SIMTEC</b><span style="opacity:.8;font-size:14px">Driver</span>
  <span style="margin-left:auto;font-size:12px;opacity:.85" id="who"></span>
</div>

<div class="wrap">
  <div class="err" id="err"></div>
  <div id="view"></div>
</div>

<script>
const SB_URL = "https://jvqjoenaungubpoegyvf.supabase.co";
const SB_KEY = "sb_publishable_J4MYTdJJyEaWe-GadpwdYA_upPT2rKw";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toastLike(msg){
  const e=document.getElementById("err");
  e.style.display="block"; e.style.background="#eef6f0"; e.style.borderColor="#bcdcc6"; e.style.color="#1c6b34";
  e.textContent=msg;
  setTimeout(()=>{ e.style.display="none"; e.style.background=""; e.style.borderColor=""; e.style.color=""; }, 6000);
}
const showErr = m => { const e=$("err"); e.style.display=m?"block":"none"; e.textContent=m||""; };
const tm = d => d ? new Date(d).toLocaleTimeString("en-NZ",{hour:"2-digit",minute:"2-digit"}) : "—";

let ME=null, ROLE=null, RUN=null, STOPS=[], ONBREAK=false, PING=null, CURRENT=null;

/* ---------------- location ---------------- */
function here(timeout=8000){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({lat:null,lng:null});
    navigator.geolocation.getCurrentPosition(
      p => res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6),
                acc:p.coords.accuracy, speed:p.coords.speed}),
      () => res({lat:null,lng:null}), {enableHighAccuracy:true, timeout, maximumAge:5000});
  });
}
function startPings(){
  if(PING) clearInterval(PING);
  const send = async () => { const p = await here(6000);
    if(p.lat!=null) sb.rpc("driver_ping",{p_lat:p.lat,p_lng:p.lng,p_acc:p.acc||null,p_speed:p.speed||null}); };
  send(); PING = setInterval(send, 60000);          // a ping a minute while the app is open
}

/* ---------------- crew sign in / out (shared iPad) ----------------
   Several warehouse staff share one iPad. Each taps their own name and gets a
   code emailed to them - that proves who it is, clocks them on, and adds them to
   today's run. The run belongs to the day and the truck, not to one person. */
let CREW = [], PENDING = null;

async function loadCrew(){
  const { data, error } = await sb.rpc("crew_list");
  if(error){ showErr("Couldn't load the crew list: " + error.message); return []; }
  CREW = data || [];
  return CREW;
}

function crewView(){
  const rows = CREW.map(c => `
    <div class="card" style="${c.on_now?'border-color:var(--green)':''}">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-weight:800;font-size:17px">${esc(c.name)}</div>
          <div class="muted">${c.on_now ? "Signed on " + tm(c.signed_in_at) : "Not signed on"}</div>
        </div>
        <button class="${c.on_now?'stop':'primary'}" style="min-width:118px"
          onclick="startCode('${c.user_id}','${esc(c.email)}','${c.on_now?'out':'in'}')">
          ${c.on_now ? "Sign out" : "Sign in"}</button>
      </div>
    </div>`).join("");

  $("view").innerHTML = `
    <div class="card">
      <h2>Warehouse crew</h2>
      <div class="muted">Tap your name to sign on or off. A 6-digit code goes to your email so we know it is you.</div>
    </div>
    ${rows || '<div class="card"><div class="muted">No warehouse staff set up yet - ask the office.</div></div>'}
    ${ME ? `<div class="card">
        <button class="wide" onclick="SHOW_RUN=true;load()">Open today's run</button>
        <button class="wide" style="margin-top:8px;background:#fff;color:#122347;border:1px solid #cbd4df"
          onclick="startPractice()">\u{1F393} Practice run \u2014 nothing is sent</button>
        <div class="gps" style="margin-top:6px">Use the practice run to learn the app or train someone.
          Invented customers, no texts, no deliveries recorded.</div>
      </div>` : ""}`;
}

async function startCode(userId, email, action){
  showErr("");
  PENDING = { userId, email, action };
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
  if(error){ showErr(error.message.includes("not found") ? "That email isn't set up yet - ask the office." : error.message); return; }
  codeView();
}

function codeView(){
  const who = (CREW.find(c=>c.user_id===PENDING.userId)||{}).name || "";
  $("view").innerHTML = `
    <div class="card">
      <h2>${esc(who)} - check your email</h2>
      <div class="muted">A 6-digit code has gone to ${esc(PENDING.email)}.</div>
      <label>Code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      <button class="wide primary" onclick="finishCode()">${PENDING.action==="in"?"Sign me on":"Sign me off"}</button>
      <button class="wide" onclick="backToCrew()">Cancel</button>
    </div>`;
}

async function finishCode(){
  showErr("");
  // iOS autofill and copy-paste both like to bring spaces along, and a stray
  // character makes a valid code look wrong. Keep the digits, drop the rest.
  const token = (($("code")||{}).value||"").replace(/\D/g, "");
  if(!token) return showErr("Enter the code from your email.");
  if(token.length < 6) return showErr("That code looks too short \u2014 it should be 6 digits.");
  const { error } = await sb.auth.verifyOtp({ email: PENDING.email, token, type:"email" });
  if(error) return showErr("That code didn't work. If you asked for more than one, use the newest email \u2014 older codes stop working.");
  const p = await here();
  const r = PENDING.action==="in"
    ? await rpc("crew_sign_in", { p_lat:p.lat, p_lng:p.lng, p_vehicle:VEHICLE, p_device:deviceKey() })
    : await rpc("crew_sign_out", { p_lat:p.lat, p_lng:p.lng, p_device:deviceKey() });
  if(!r) return;
  PENDING = null;
  await boot();
}

function backToCrew(){ PENDING=null; SHOW_RUN=false; showErr(""); boot(); }

/* ---------------- boot ---------------- */
const VEHICLE = "Truck 1";
let SHOW_RUN = false;
let PRACTICE = false;   // true while the training run is open


/* ---------------------------------------------------------------------------
   This device.

   Nigel, 8 Aug: staff must not be able to sign on from their own phone before
   they reach work. So the crew screen only works on a device the OFFICE has
   paired. The iPad keeps a random key; every sign-on and sign-off sends it, and
   the server refuses anything it doesn't recognise.

   The key lives in localStorage, which survives closing the app but not
   clearing the browser. If that happens the office issues a new pairing code —
   twenty seconds, not a rebuild.
--------------------------------------------------------------------------- */
const DEV_KEY = "simtec_crew_device";
function deviceKey(){
  try{
    let k = localStorage.getItem(DEV_KEY);
    if(!k){
      k = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random())
          .replace(/-/g, "");
      localStorage.setItem(DEV_KEY, k);
    }
    return k;
  }catch(e){ return ""; }        // private browsing — will simply be refused
}

async function deviceIsPaired(){
  try{
    const { data } = await sb.rpc("crew_device_ok", { p_key: deviceKey() });
    return data === true;
  }catch(e){ return false; }
}

function pairScreen(msg){
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Set up this iPad</h2>
      <div class="muted" style="margin-bottom:10px">
        ${msg || "Sign-on works on the warehouse iPad only. Ask the office for a set-up code."}
      </div>
      <label>Set-up code</label>
      <input id="pcode" inputmode="latin" autocapitalize="characters" placeholder="ABC123">
      <button class="wide primary" onclick="claimDevice()">Set up this iPad</button>
    </div>`;
}

async function claimDevice(){
  const code = ((document.getElementById("pcode")||{}).value||"").trim().toUpperCase();
  if(!code) return showErr("Enter the code the office gave you.");
  const { data, error } = await sb.rpc("crew_claim_device", { p_code: code, p_key: deviceKey() });
  if(error) return showErr(error.message);
  if(data && data.ok === false) return showErr(data.error);
  showErr("");
  alert("This iPad is set up as \"" + (data.label || "the warehouse iPad") + "\". You can sign on now.");
  boot();
}

async function boot(){
  showErr("");
  // Nothing else happens until we know this is the warehouse iPad.
  if(!(await deviceIsPaired())) return pairScreen();
  await loadCrew();
  const { data:{ session } } = await sb.auth.getSession();
  ME = null;
  if(session){
    const { data:prof } = await sb.from("profiles").select("full_name,email,active")
      .eq("id", session.user.id).maybeSingle();
    if(prof && prof.active !== false) ME = { id: session.user.id, name: prof.full_name || prof.email };
  }
  const on = CREW.filter(c=>c.on_now);
  $("who").textContent = on.length ? on.map(c=>String(c.name).split(" ")[0]).join(", ") + " on" : "nobody signed on";
  if(SHOW_RUN && ME) return load();
  crewView();
}


/* Training. A real run texts real customers and marks real orders delivered, so
   nobody can learn on it. The practice run is the same app with invented stops
   that point at no order — the NEXT text is shown rather than sent, and nothing
   reaches a customer or the office figures. */
async function startPractice(){
  showErr("");
  const r = await rpc("practice_run");
  if(!r || r.ok===false) return;
  PRACTICE = true; SHOW_RUN = true;
  await load();
}
async function endPractice(){
  if(!confirm("Finish practice? The practice run is deleted.")) return;
  await rpc("practice_run_clear");
  PRACTICE = false; SHOW_RUN = false;
  await load();
}

async function load(){
  let runId = null;
  if(PRACTICE){
    // the practice run is dated far in the future so it can never collide with
    // a real day, which also means my_run_today() will never return it
    const { data:pr } = await sb.from("driver_runs").select("id").eq("practice",true).limit(1);
    runId = (pr&&pr[0]) ? pr[0].id : null;
  }
  if(!runId){ const { data:rid } = await sb.rpc("my_run_today"); runId = rid; }
  if(!runId){ RUN=null; STOPS=[]; return render(); }
  const { data:runs } = await sb.from("v_driver_runs").select("*").eq("id", runId).limit(1);
  RUN = (runs||[])[0] || null;
  if(RUN){
    const { data:stops } = await sb.from("v_driver_stops").select("*").eq("run_id",RUN.id).order("seq");
    STOPS = stops||[];
    const { data:br } = await sb.from("driver_breaks").select("id").eq("run_id",RUN.id).is("ended_at",null);
    ONBREAK = !!(br&&br.length);
    if(RUN.status==="active") startPings();
  } else { STOPS=[]; }
  render();
}

/* ---------------- main screens ---------------- */
function render(){
  if(CURRENT) return renderStop();
  if(!RUN) return $("view").innerHTML = `
    <div class="card"><h2>No run today</h2>
      <div class="muted">The office hasn't set up a run for you yet. Give them a call if that's not right.</div>
      <button class="wide" onclick="load()">Check again</button>
      <button class="wide" onclick="backToCrew()">\u2039 Crew sign in / out</button></div>`;

  if(RUN.status==="planned") return $("view").innerHTML = `
    <div class="card">
      <h2>${RUN.stops} stop${RUN.stops==1?"":"s"} today</h2>
      <div class="muted">${esc(RUN.vehicle||"")} · tap when you get to work. This starts your timesheet.</div>
      <button class="wide primary" onclick="startDay()">I'm at work — start my day</button>
    </div>` + stopList();

  if(RUN.status==="done") return $("view").innerHTML = `
    <div class="card"><h2>Day finished</h2>
      <div class="muted">${RUN.done} delivered${RUN.failed?`, ${RUN.failed} not completed`:""} ·
        ${RUN.hours_on_road||0} hours · ${RUN.break_minutes} min break. Your timesheet is with the office.</div>
      <button class="wide" onclick="backToCrew()">\u2039 Crew sign in / out</button></div>` + stopList();

  const nextStop = STOPS.find(s=>s.status==="pending"||s.status==="en_route"||s.status==="arrived");
  $("view").innerHTML = `
    ${RUN&&RUN.practice?`<div class="banner" style="background:#fdf3e0;border-color:#e2c48a;color:#8a6d2f">
       <b>PRACTICE RUN</b> — invented customers. Nothing is texted and no delivery is recorded.
       <button onclick="endPractice()" style="margin-top:8px;width:100%;background:#8a6d2f;color:#fff;
         border:none;border-radius:8px;padding:9px">Finish practice</button></div>`:""}
    ${ONBREAK?`<div class="banner">On a break — nothing is being recorded against a stop.</div>`:""}
    ${!RUN.left_warehouse_at ? `
      <div class="card" style="border-color:var(--blue)">
        <h2>Ready to leave?</h2>
        <div class="muted">Tap when you pull out of the yard — it texts the first customer with a travel time worked out from where you are.</div>
        <button class="wide blue" onclick="leaveWarehouse()">LEFT WAREHOUSE</button>
      </div>`:""}
    <div class="card">
      <h2>${RUN.done} of ${RUN.stops} done</h2>
      <div class="muted">At work ${tm(RUN.started_at)}${RUN.left_warehouse_at?` · left the yard ${tm(RUN.left_warehouse_at)}`:""} · ${esc(RUN.vehicle||"")}</div>
      <button class="wide" style="margin-top:2px" onclick="backToCrew()">\u2039 Crew sign in / out</button>
      <div class="row" style="margin-top:12px">
        ${ONBREAK
          ? `<button class="primary" onclick="brk(false)">Finish break</button>`
          : `<button class="warn" onclick="brk(true)">Take a break</button>`}
        <button class="stop" onclick="endDay()">End the day (everyone off)</button>
      </div>
      ${RUN.stops - RUN.done > 1 ? `<button class="wide" style="margin-top:8px"
        onclick="reorderFromHere(this)">\u{1F9ED} Best order from where I am</button>` : ""}
    </div>
    ${nextStop && !ONBREAK ? `
      <div class="card" style="border-color:var(--blue)">
        <div class="muted">NEXT STOP</div>
        <h2>${esc(nextStop.customer||"—")}</h2>
        <div class="muted">${esc(nextStop.address||"")}${nextStop.suburb?", "+esc(nextStop.suburb):""}</div>
        <button class="wide blue" onclick="openStop('${nextStop.id}')">Open this stop</button>
      </div>`:""}
    ${stopList()}`;
}

function stopList(){
  const rows = STOPS.map(s=>{
    const cls = s.status==="done"?"done":s.status==="failed"?"failed":
                (s.status==="en_route"||s.status==="arrived")?"now":"";
    const chip = s.status==="done"?'<span class="chip ok">Delivered</span>'
      : s.status==="failed"?`<span class="chip bad">${esc(s.outcome||"not done")}</span>`
      : s.status==="arrived"?'<span class="chip go">On site</span>'
      : s.status==="en_route"?'<span class="chip go">On the way</span>':"";
    return `<div class="stopcard" onclick="openStop('${s.id}')">
      <div class="seq ${cls}">${s.seq}</div>
      <div style="flex:1">
        <div style="font-weight:700">${esc(s.customer||"—")} ${chip}</div>
        ${s.customer2?`<div class="muted" style="font-size:14px">with ${esc(s.customer2)}</div>`:""}
        <div style="font-size:17px;font-weight:600;color:#1b2a4a;line-height:1.3">${esc(s.address||"")}</div>
        <div class="muted" style="font-size:14.5px">${esc(s.suburb||"")}</div>
        <div class="muted">${s.item_count} item${s.item_count==1?"":"s"}${s.delivery_time?" · "+esc(s.delivery_time):""}
          ${s.minutes_on_site!=null?` · ${s.minutes_on_site} min on site`:""}</div>
      </div></div>`;}).join("");
  return `<div class="card"><h2>Today's stops</h2>${rows||'<div class="muted">Nothing loaded.</div>'}</div>`;
}

/* ---------------- one stop ---------------- */
async function openStop(id){
  CURRENT = STOPS.find(s=>s.id===id);
  if(!CURRENT) return;
  const { data:items } = await sb.from("driver_stop_items").select("*").eq("stop_id",id).order("product_name");
  CURRENT._items = items||[];
  renderStop();
}
function renderStop(){
  const s = CURRENT;
  const done = s.status==="done"||s.status==="failed";
  // Navigate to the exact spot when we have coordinates, and fall back to the
  // written address when we don't. Google opens its app on the iPad if it is
  // installed; the Apple link is there for when it isn't.
  const where = (s.stop_lat!=null && s.stop_lng!=null)
    ? `${s.stop_lat},${s.stop_lng}`
    : ((s.address||"")+" "+(s.suburb||"")+" Auckland");
  const maps  = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(where)}`;
  const amaps = `https://maps.apple.com/?daddr=${encodeURIComponent(where)}&dirflg=d`;
  $("view").innerHTML = `
    <div class="card">
      <button onclick="CURRENT=null;render()" style="margin-bottom:10px">‹ Back to run</button>
      <h2>${s.seq}. ${esc(s.customer||"—")}${s.customer2?` <span style="font-weight:600">&amp; ${esc(s.customer2)}</span>`:""}</h2>
      <div class="bigaddr">${esc(s.address||"")}</div>
      <div class="bigsub">${esc(s.suburb||"")}${s.delivery_time?" &middot; "+esc(s.delivery_time):""}</div>
      ${s.mobile?`<a class="bigtel" href="tel:${esc((s.mobile||"").replace(/\s/g,""))}">
          <span class="telwho">${esc((s.customer||"").split(" ")[0]||"Applicant 1")}</span>${esc(s.mobile)}</a>`:""}
      ${s.mobile2?`<a class="bigtel" href="tel:${esc((s.mobile2||"").replace(/\s/g,""))}">
          <span class="telwho">${esc((s.customer2||"").split(" ")[0]||"Second name")}</span>${esc(s.mobile2)}</a>`:""}
      ${(s.customer2 && !s.mobile2)?`<div class="bigsub" style="margin-top:-6px">Also on the order: ${esc(s.customer2)} (no number)</div>`:""}
      <a class="nav" href="${maps}" target="_blank" rel="noopener">Directions to this address</a>
      <a class="navalt" href="${amaps}" target="_blank" rel="noopener">or open in Apple Maps</a>
      ${s.delivery_note?`<div class="banner" style="margin-top:10px">${esc(s.delivery_note)}</div>`:""}
      <div class="gps" style="margin-top:8px">
        ${s.notified_at?`Texted ${tm(s.notified_at)} · `:""}${s.arrived_at?`Arrived ${tm(s.arrived_at)} · `:""}
        ${s.departed_at?`Left ${tm(s.departed_at)}`:""}
      </div>
    </div>

    ${done?`<div class="card"><h2>Finished</h2>
        <div class="muted">${esc(s.outcome||"")}${s.notes?" — "+esc(s.notes):""} ·
        ${s.items_ticked}/${s.item_count} items · ${s.photo_count} photo${s.photo_count==1?"":"s"}</div></div>`:`
    <div class="card">
      <h2>On the way</h2>
      <div class="muted">Tap NEXT as you leave the stop before this one — it works out how far away you are and texts this customer the travel time.</div>
      <button class="wide blue" onclick="nextStop()" ${s.notified_at?"disabled":""}>
        ${s.notified_at?"Customer already told":"NEXT — tell them we're coming"}</button>
      <button class="wide" onclick="arrive()" ${s.arrived_at?"disabled":""}>
        ${s.arrived_at?"Arrived "+tm(s.arrived_at):"I've arrived"}</button>
    </div>

    <div class="card">
      <h2>What's going in</h2>
      ${s._items.map(i=>`<label class="tick">
          <input type="checkbox" ${i.delivered?"checked":""} onchange="tick('${i.id}',this.checked)">
          <span>${esc(i.product_name)}${i.quantity>1?` ×${i.quantity}`:""}</span></label>`).join("")
        || '<div class="muted">No items listed on this order.</div>'}
    </div>

    <div class="card">
      <h2>Proof</h2>
      <label>Photo (of the delivery or where you left it)</label>
      <input type="file" accept="image/*" capture="environment" onchange="uploadPhoto(this)">
      <div class="muted" id="photoState">${s.photo_count} taken</div>
      <label>Customer signature</label>
      <canvas id="sig"></canvas>
      <div class="row" style="margin-top:8px">
        <button onclick="clearSig()">Clear</button>
        <button class="primary" onclick="saveSig()">Save signature</button>
      </div>
      <div class="muted" id="sigState">${s.signature_path?"Signature saved":"Not signed yet"}</div>
    </div>

    <div class="card">
      <h2>Finish this stop</h2>
      <label>Notes (optional)</label>
      <textarea id="notes" rows="2" placeholder="e.g. left in front bedroom"></textarea>
      <button class="wide primary" onclick="finish('delivered')">All delivered</button>
      <div class="row" style="margin-top:8px">
        <button onclick="finish('part')">Part delivered</button>
        <button onclick="finish('not_home')">Not home</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button onclick="finish('refused')">Refused</button>
        <button onclick="finish('wrong_address')">Wrong address</button>
        <button onclick="finish('damaged')">Damaged</button>
      </div>
    </div>`}`;
  if(!done) initSig();
}

/* ---------------- actions ---------------- */
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args||{});
  if(error){ showErr(error.message); return null; }
  if(data && data.ok===false){ showErr(data.error||"That didn't work"); return null; }
  return data||{};
}
async function startDay(){
  const p = await here();
  if(!await rpc("driver_start_run",{p_lat:p.lat,p_lng:p.lng,p_vehicle:RUN.vehicle})) return;
  startPings(); await load();
}
async function endDay(){
  if(!confirm("End the day for the whole crew? Anyone still signed on is signed off and their timesheet closed.")) return;
  const p = await here();
  const r = await rpc("driver_end_run",{p_lat:p.lat,p_lng:p.lng});
  if(!r) return;
  if(PING) clearInterval(PING);
  CURRENT=null; await load();
}

/* The office puts the run in driving order from the yard first thing. Once the
   day is under way the truck is somewhere else entirely, and a stop may have
   been added or missed — so the driver can ask for the best order FROM HERE.
   Stops already delivered keep their place; only what is left gets reshuffled. */
async function reorderFromHere(btn){
  if(!RUN) return;
  const label = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Working it out\u2026"; }
  const p = await here();
  const { data, error } = await sb.rpc("driver_optimise_run", {
    p_run: RUN.id, p_start_lat: p.lat, p_start_lng: p.lng });
  if(btn){ btn.disabled = false; btn.textContent = label; }
  if(error) return showErr(error.message);
  if(data && data.ok === false) return showErr(data.error);
  if(data){
    showErr("");
    alert(data.km_saved > 0.5
      ? `Re-ordered \u2014 ${data.km_after} km left instead of ${data.km_before}, saving ${data.km_saved} km.`
      : `Already in a sensible order \u2014 ${data.km_after} km to go.`);
  }
  await load();
}

async function brk(start){
  const p = await here();
  if(!await rpc("driver_break",{p_start:start,p_lat:p.lat,p_lng:p.lng})) return;
  await load();
}
async function leaveWarehouse(){
  showErr("");
  const p = await here();
  const r = await rpc("driver_leave_warehouse",{p_lat:p.lat,p_lng:p.lng});
  if(!r) return;
  if(r.no_stops){ await load(); return; }
  if(!r.mobile){ showErr("No mobile for the first customer — give them a ring."); await load(); return; }
  if(RUN && RUN.practice){
    alert("PRACTICE \u2014 nothing was sent.\n\nOn a real run this text would go to " + (r.mobile||"the customer") + ":\n\n" + r.message);
    await rpc("driver_mark_notified",{p_stop:r.stop_id,p_ok:true,p_eta_minutes:r.eta_minutes||null,p_km:r.km||null});
    await load(); return;
  }
  const { data, error } = await sb.functions.invoke("hyper-handler",{ body:{ mobile:r.mobile, message:r.message } });
  if(error || (data&&data.error)) showErr("Left the yard, but the text didn't send: " + ((data&&data.error)||error.message));
  else await rpc("driver_mark_notified",{p_stop:r.stop_id,p_ok:true,
                  p_eta_minutes:r.eta_minutes||null,p_km:r.km||null});
  await load();
}
async function nextStop(){
  showErr("");
  const p = await here();
  const r = await rpc("driver_next_stop",{p_stop:CURRENT.id,p_lat:p.lat,p_lng:p.lng});
  if(!r) return;
  if(!r.mobile){ showErr("No mobile number for this customer — give them a ring instead."); return; }
  if(RUN && RUN.practice){
    alert("PRACTICE \u2014 nothing was sent.\n\nOn a real run this text would go to " + (r.mobile||"the customer") + ":\n\n" + r.message);
    await rpc("driver_mark_notified",{p_stop:CURRENT.id,p_ok:true,p_eta_minutes:r.eta_minutes||null,p_km:r.km||null});
    await load(); return;
  }
  const { data, error } = await sb.functions.invoke("hyper-handler",{ body:{ mobile:r.mobile, message:r.message } });
  if(error || (data&&data.error)){ showErr("Couldn't send the text: " + ((data&&data.error)||error.message)); return; }
  await rpc("driver_mark_notified",{p_stop:CURRENT.id,p_ok:true,
             p_eta_minutes:r.eta_minutes||null,p_km:r.km||null});
  showErr("");
  toastLike(`Texted ${r.name}: ${r.eta_text}${r.km?` (${r.km} km away)`:""}`);
  await refreshStop();
}
async function arrive(){
  const p = await here();
  if(!await rpc("driver_arrive",{p_stop:CURRENT.id,p_lat:p.lat,p_lng:p.lng})) return;
  await refreshStop();
}
async function tick(id, val){ await rpc("driver_tick_item",{p_item:id,p_delivered:val}); }
async function finish(outcome){
  const nice = {delivered:"all delivered",part:"part delivered",not_home:"not home",
                refused:"refused",wrong_address:"wrong address",damaged:"damaged"}[outcome];
  if(!confirm(`Finish this stop as "${nice}"?`)) return;
  const p = await here();
  const notes = ($("notes")&&$("notes").value||"").trim();
  if(!await rpc("driver_complete_stop",{p_stop:CURRENT.id,p_outcome:outcome,p_notes:notes,
        p_lat:p.lat,p_lng:p.lng,p_signature:null})) return;
  CURRENT=null; await load();
}
async function refreshStop(){
  const id = CURRENT.id;
  const { data } = await sb.from("v_driver_stops").select("*").eq("id",id).maybeSingle();
  if(data){ const items = CURRENT._items; CURRENT = data; CURRENT._items = items; }
  const idx = STOPS.findIndex(s=>s.id===id); if(idx>=0 && data) STOPS[idx]=data;
  renderStop();
}

/* ---------------- proof ---------------- */
async function uploadPhoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  $("photoState").textContent = "Uploading…";
  const p = await here(4000);
  const path = `${CURRENT.run_id}/${CURRENT.id}/photo-${Date.now()}.jpg`;
  const { error } = await sb.storage.from("delivery-proof").upload(path, f, {contentType:f.type||"image/jpeg"});
  if(error){ $("photoState").textContent = "Upload failed — try again"; return; }
  await sb.from("driver_photos").insert({stop_id:CURRENT.id, path, lat:p.lat, lng:p.lng});
  $("photoState").textContent = "Photo saved";
}
let SIGCTX=null, DRAWN=false;
function initSig(){
  const c = $("sig"); if(!c) return;
  const r = c.getBoundingClientRect();
  c.width = r.width*2; c.height = r.height*2;
  SIGCTX = c.getContext("2d"); SIGCTX.scale(2,2);
  SIGCTX.lineWidth=2; SIGCTX.lineCap="round"; SIGCTX.strokeStyle="#12203a";
  let drawing=false;
  const pos = e => { const b=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
                     return {x:t.clientX-b.left, y:t.clientY-b.top}; };
  const down = e => { drawing=true; DRAWN=true; const p=pos(e); SIGCTX.beginPath(); SIGCTX.moveTo(p.x,p.y); e.preventDefault(); };
  const move = e => { if(!drawing) return; const p=pos(e); SIGCTX.lineTo(p.x,p.y); SIGCTX.stroke(); e.preventDefault(); };
  const up = () => { drawing=false; };
  c.onmousedown=down; c.onmousemove=move; c.onmouseup=up; c.onmouseleave=up;
  c.ontouchstart=down; c.ontouchmove=move; c.ontouchend=up;
}
function clearSig(){ const c=$("sig"); if(c&&SIGCTX){ SIGCTX.clearRect(0,0,c.width,c.height); DRAWN=false; } }
async function saveSig(){
  if(!DRAWN) return showErr("Ask the customer to sign in the box first.");
  showErr("");
  $("sigState").textContent = "Saving…";
  const blob = await new Promise(r => $("sig").toBlob(r, "image/png"));
  const path = `${CURRENT.run_id}/${CURRENT.id}/signature.png`;
  const { error } = await sb.storage.from("delivery-proof").upload(path, blob, {contentType:"image/png", upsert:true});
  if(error){ $("sigState").textContent = "Couldn't save — try again"; return; }
  await sb.from("driver_stops").update({signature_path:path}).eq("id",CURRENT.id);
  $("sigState").textContent = "Signature saved";
}

async function signOut(){ if(PING) clearInterval(PING); await sb.auth.signOut(); location.reload(); }

boot();
</script>
